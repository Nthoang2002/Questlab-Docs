<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Questlab Docs</title>
  <style>
    :root{--bg:#f6f7fb;--panel:#fff;--text:#20242c;--muted:#68707d;--line:#e2e6ec;--brand:#5b5bd6;--soft:#eeeeff;--code:#181b22;--shadow:0 10px 35px rgba(35,40,55,.07)}
    [data-theme=dark]{--bg:#111318;--panel:#191c23;--text:#ecedf1;--muted:#a3a9b4;--line:#30343e;--brand:#9b9cff;--soft:#292a4c;--code:#0c0e12;--shadow:none}
    *{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.7 Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}
    button,input{font:inherit}.app{display:grid;grid-template-columns:290px minmax(0,1fr);min-height:100vh}.sidebar{position:fixed;inset:0 auto 0 0;width:290px;background:var(--panel);border-right:1px solid var(--line);padding:22px 16px;overflow:auto;z-index:5}
    .brand{display:flex;gap:11px;align-items:center;padding:0 8px 18px}.logo{display:grid;place-items:center;width:38px;height:38px;border-radius:11px;background:linear-gradient(135deg,#5b5bd6,#8b5cf6);color:#fff;font-weight:800}.brand strong{display:block;font-size:17px}.brand small,.meta{color:var(--muted)}
    .search{width:100%;border:1px solid var(--line);background:var(--bg);color:var(--text);border-radius:10px;padding:10px 12px;outline:none}.search:focus{border-color:var(--brand);box-shadow:0 0 0 3px var(--soft)}
    .group{margin-top:20px}.group-title{text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-size:11px;font-weight:750;padding:0 9px 6px}.nav-item{display:flex;gap:8px;align-items:flex-start;width:100%;border:0;background:transparent;color:var(--text);text-align:left;border-radius:8px;padding:8px 9px;cursor:pointer;line-height:1.35}.nav-item:hover,.nav-item.active{background:var(--soft);color:var(--brand)}.tag{font-size:9px;padding:2px 4px;border:1px solid currentColor;border-radius:4px;opacity:.7;margin-top:2px}.empty{color:var(--muted);padding:14px 9px}
    .main{grid-column:2;padding:28px 32px 70px}.toolbar{max-width:1040px;margin:0 auto 16px;display:flex;justify-content:space-between;align-items:center}.crumb{color:var(--muted);font-size:13px}.actions{display:flex;gap:8px}.icon-btn{border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:9px;padding:7px 11px;cursor:pointer}.icon-btn:hover{border-color:var(--brand)}
    .article{max-width:1040px;margin:auto;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:48px 56px;box-shadow:var(--shadow);overflow:hidden}.article h1{font-size:2.2rem;line-height:1.2;margin:0 0 1.4rem}.article h2{font-size:1.55rem;border-bottom:1px solid var(--line);padding-bottom:.4rem;margin-top:2.3rem}.article h3{font-size:1.2rem;margin-top:1.8rem}.article h4{font-size:1.05rem}.article a{color:var(--brand);text-decoration:none}.article a:hover{text-decoration:underline}.article p{margin:1em 0}.article ul,.article ol{padding-left:1.5rem}.article blockquote{margin:1.2rem 0;padding:.6rem 1rem;border-left:4px solid var(--brand);background:var(--soft);color:var(--muted)}
    code{font:13px/1.55 ui-monospace,SFMono-Regular,Consolas,monospace;background:var(--soft);padding:.14em .35em;border-radius:5px}pre{position:relative;background:var(--code);color:#e6edf3;border-radius:10px;padding:18px;overflow:auto;tab-size:2}pre code{background:transparent;padding:0;color:inherit}.table-wrap{overflow:auto;margin:1.2rem 0}table{border-collapse:collapse;width:100%;font-size:14px}th,td{border:1px solid var(--line);padding:9px 12px;text-align:left;vertical-align:top}th{background:var(--soft)}hr{border:0;border-top:1px solid var(--line);margin:2rem 0}.anchor{opacity:0;margin-left:.35em}.article h2:hover .anchor,.article h3:hover .anchor{opacity:.65}
    .d2-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}.d2-head h1{margin:0}.hint{background:var(--soft);border-radius:10px;padding:12px 15px;color:var(--muted);margin-bottom:18px}.d2-source{min-height:55vh}.mobile-top{display:none}.search-hit{background:#fff1a8;color:#26231b;border-radius:2px}
    @media(max-width:800px){.app{display:block}.sidebar{transform:translateX(-100%);transition:.2s;width:min(88vw,320px);box-shadow:var(--shadow)}.sidebar.open{transform:none}.main{padding:14px 12px 50px}.article{padding:28px 20px;border-radius:11px}.toolbar{margin-bottom:10px}.mobile-top{display:inline-block}.article h1{font-size:1.75rem}.article h2{font-size:1.35rem}.crumb{max-width:55vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}}
    @media print{.sidebar,.toolbar{display:none}.app{display:block}.main{padding:0}.article{border:0;box-shadow:none;max-width:none;padding:0}}
  </style>

  <div class="app">
    <aside class="sidebar" id="sidebar">

  <script>
    const DOCS = [{"path":"README.md","type":"md","group":"Bắt đầu","title":"Questlab Backend — Tài liệu onboarding","content":"# Questlab Backend — Tài liệu onboarding\n\nTài liệu được dựng bằng cách **đọc source thực tế** của `questlab-service`\n(702 file Java, 107 file test, 37 migration SQL) và `pom.xml` của cả 4 repo trong workspace.\nMọi tên class, tên bảng, tên property đều là thật; kết luận quan trọng đều có mục **Evidence**.\nChỗ nào chưa đủ căn cứ thì ghi rõ *\"Chưa đủ evidence trong source để kết luận\"*.\n\nTất cả file `.d2` đã được **compile thành công bằng `d2 v0.8.2`** — dán thẳng vào\n\u003chttps://play.d2lang.com/> là render được.\n\n---\n\n## Bắt đầu từ đâu\n\n| Bạn là… | Đọc theo thứ tự này |\n|---|---|\n| **Dev mới vào team** | `overview/questlab-backend-overview.md` §1→§6 → `overview/questlab-architecture.d2` → §22 Code Reading Roadmap |\n| **Đang debug một bug** | `overview/questlab-backend-overview.md` §21 Debugging Guide |\n| **Nhận ticket mới** | `overview/questlab-backend-overview.md` §23 \"Nơi cần sửa khi nhận feature\" → doc domain tương ứng |\n| **Chuẩn bị phỏng vấn** | Toàn bộ overview → phần *Interview Preparation* ở cuối |\n| **Muốn hiểu 1 flow cụ thể** | `flows/main-business-flows.md` + file `.d2` tương ứng |\n\n---\n\n## Cấu trúc\n\n```\ndocs/\n├── README.md                              ← file này\n│\n├── overview/\n│   ├── questlab-backend-overview.md       ★ TÀI LIỆU CHÍNH (23 mục + knowledge priority + 64 câu phỏng vấn)\n│   └── questlab-architecture.d2           ★ KIẾN TRÚC TỔNG (4 tầng)\n│\n├── services/                              ← từng business domain\n│   ├── task-assignment.md / .d2           ⭐ domain lõi — đọc đầu tiên\n│   ├── label-studio.md / .d2              ⭐ tích hợp quan trọng nhất\n│   ├── project-campaign.md / .d2\n│   ├── qualification.md / .d2\n│   ├── task-import.md / .d2               ← domain lớn nhất về số file\n│   ├── compensation-payout.md / .d2       ⭐ code chất lượng cao nhất, đáng học\n│   ├── partner-integration.md / .d2\n│   └── recommendation.md / .d2            ← nơi DUY NHẤT dùng Redis\n│\n└── flows/\n    ├── main-business-flows.md             ← 10 flow, trace đầy đủ Controller→Service→Repo→DB→External\n    ├── 01-request-task.d2                 ⭐\n    ├── 02-submit-annotation.d2\n    ├── 03-label-studio-webhook.d2\n    ├── 04-reconciliation.d2\n    ├── 05-assignment-expiry.d2\n    ├── 06-task-import-async.d2\n    ├── 07-external-storage-import.d2\n    ├── 08-payout-request-to-paid.d2\n    ├── 09-partner-sdk.d2\n    └── 10-media-signed-url.d2\n```\n\n---\n\n## Tóm tắt 60 giây\n\n**Questlab = nền tảng crowdsourcing gán nhãn dữ liệu.** Label Studio làm trình soạn nhãn;\nQuestlab làm lớp điều phối nhân lực phía trước nó.\n\n| | |\n|---|---|\n| Stack | Java 17 · Spring Boot **3.3.2** · Spring Cloud 2023.0.3 · Maven |\n| DB | **MariaDB** (`questlab_data`), 47 entity, `ddl-auto: none`, 37 migration SQL chạy tay |\n| Redis | **CÓ** — nhưng chỉ cho Home recommendation; degrade được |\n| Kafka / RabbitMQ | **KHÔNG** trong questlab-service (Kafka nằm ở `notification-service`) |\n| Feign | **KHÔNG** — dùng `RestTemplate` + Apache HttpClient5 |\n| Spring Security | **KHÔNG** — filter thủ công + `AuthClient` |\n| API | ~171 endpoint, response luôn HTTP **200**, mã lỗi trong body |\n| Scheduler | **9** job `@Scheduled` |\n| External | Label Studio · auth-service · notification-service · file-service · S3/MinIO · SFTP |\n| Deploy | Dockerfile → GitLab CI → image registry → sed `values.yaml` của Helm repo → GitOps K8s |\n\n**3 điều dễ sai nhất khi mới vào:**\n1. HTTP status **luôn 200** — nhìn `body.status` / `body.httpCode`, không nhìn status line.\n2. Mọi query nghiệp vụ phải kèm `is_deleted = false AND ls_deleted = false`.\n3. Hằng số nghiệp vụ (cron, quota, TTL, giới hạn file) nằm ở **`application.yml`**, không\n   hardcode trong Java — đọc file đó trước khi đoán.\n\n---\n\n## Tài liệu gốc trong repo `questlab-service`\n\nĐây là tài liệu **onboarding tổng hợp**. Khi làm ticket cụ thể, đọc thêm:\n\n| File | Nội dung |\n|---|---|\n| `questlab-service/CLAUDE.md` | Team knowledge base + lịch sử version |\n| `questlab-service/conventions/CODING_CONVENTIONS.md` | Quy ước code |\n| `questlab-service/conventions/QUESTLAB_PROJECT_ARCHITECTURE.md` | Hub component + layer dependency |\n| `questlab-service/conventions/QUESTLAB_ENV-SETUP.md` | Dựng môi trường local |\n| `questlab-service/conventions/TASK_DISTRIBUTION_DESIGN.md` | Thiết kế phân phối task |\n| `questlab-service/conventions/SIGNED_URL_DESIGN.md` | Thiết kế signed URL |\n| `questlab-service/requirement/TASK_ASSIGNMENT_REQURIREMENT.MD` | Requirement gốc |\n| `questlab-service/docs/*.md` | Requirement từng feature (task import, external storage, recommendation, payout…) |\n| `questlab-service/tools/graphify/out/graph.html` | Bản đồ quan hệ code sinh tự động |\n"},{"path":"flows/01-request-task.d2","type":"d2","group":"flows","title":"Request Task","content":"# Flow 1 — Request Task (POST /assignments/request)\n# Render: https://play.d2lang.com/\n\nshape: sequence_diagram\n\napp: Mobile App\nfilter: CurrentUserFilter\nctrl: AssignmentController\ndist: TaskDistributionServiceImpl\nassignedRepo: AssignedTaskRepository\nauth: auth-service\nelig: ProjectEligibilityServiceImpl\ngate: QualificationAssignmentGate\ntaskRepo: TaskRepository\ndb: MariaDB\n\napp -> filter: \"POST /assignments/request (Bearer JWT)\"\nfilter -> filter: \"getUserUUIDFromToken -> CurrentUserContext.set(userId)\"\nfilter -> ctrl: doFilter\nctrl -> ctrl: \"authClient.checkAuthorization()\"\nctrl -> dist: \"requestTask(userId)\"\n\nTX_Transactional: {\n  dist -> assignedRepo: \"1. countActiveByUserId(userId)\"\n  assignedRepo -> db: \"SELECT COUNT(*) WHERE status = PENDING\"\n  db -> assignedRepo: \"n\"\n  assignedRepo -> dist: \"n >= max-concurrent-tasks (10) -> QUOTA_EXCEEDED\"\n\n  dist -> auth: \"2. AuthProfileClient.getUserProfile(userId)\"\n  auth -> dist: \"AuthUserProfileDto (lỗi -> AuthProfileUnavailableException 503)\"\n\n  dist -> dist: \"3. profileContextBuilder.build(profile)\"\n\n  dist -> elig: \"4. findEligibleProjects(userId, context)\"\n  elig -> db: \"findActiveAssignableProjects(ACTIVE, MATCHED, now)\"\n  elig -> elig: \"policyEvaluator.evaluate() — không có policy = ALLOW\"\n  elig -> dist: \"List\u003cProjectCandidate>\"\n\n  dist -> gate: \"5. blockedProjectIds(userId, projectIds)\"\n  gate -> db: \"campaign links + config frozen + attempt PASSED\"\n  gate -> dist: \"Set bị chặn -> loại khỏi candidate\"\n\n  dist -> taskRepo: \"6. findNextAssignableTaskId(userId, ids)\"\n  taskRepo -> db: \"native SQL ... LIMIT 1 FOR UPDATE\"\n  db -> taskRepo: \"taskId — ROW ĐÃ KHOÁ\"\n  taskRepo -> dist: \"Task\"\n\n  dist -> assignedRepo: \"7. save(AssignedTask PENDING + snapshot policy/profile)\"\n  assignedRepo -> db: \"INSERT assigned_tasks\"\n\n  dist -> taskRepo: \"8. updateTaskStatus(id, IN_PROGRESS)\"\n  taskRepo -> db: \"UPDATE tasks — COMMIT nhả row lock\"\n}\n\ndist -> ctrl: \"RequestTaskResult\"\nctrl -> app: \"200 GetMethodResponse { data, message }\"\n"},{"path":"flows/02-submit-annotation.d2","type":"d2","group":"flows","title":"Submit Annotation","content":"# Flow 2 — Submit Annotation (POST /annotations)\n# Render: https://play.d2lang.com/\n\nshape: sequence_diagram\n\napp: Mobile App\nctrl: AnnotationController\nsvc: AnnotationServiceImpl\nassignedRepo: AssignedTaskRepository\ntaskRepo: TaskRepository\nvalidator: AnnotationValidationOrchestrator\nlsClient: LabelStudioClient\nls: Label Studio\nannRepo: TaskAnnotationRepository\nredis: Redis\ndb: MariaDB\n\napp -> ctrl: \"POST /annotations?assignedTaskId={uuid}\"\nctrl -> svc: \"createAnnotation(userId, request, assignedTaskId)\"\n\nTX_Transactional: {\n  svc -> assignedRepo: \"1. findByUuidAndStatus(id, PENDING)\"\n  assignedRepo -> db: SELECT\n  db -> svc: \"AssignedTask (empty -> 404 No active assignment)\"\n\n  svc -> svc: \"2. expiredAt \u003c now -> BadRequestException\"\n  svc -> svc: \"3. assignedTask.userId != userId -> UnAuthorizedException\"\n\n  svc -> taskRepo: \"4. findById(assignedTask.taskId)\"\n  taskRepo -> db: SELECT\n  db -> svc: \"Task (UNAVAILABLE -> BadRequestException)\"\n\n  svc -> validator: \"5. validate(request, projectId)\"\n  validator -> db: \"LabelConfigResolver (cache theo lsProjectId)\"\n  validator -> svc: \"OK / AnnotationValidationException\"\n\n  svc -> lsClient: \"6. createAnnotation(payload, lsTaskId)\"\n  lsClient -> ls: \"POST /api/tasks/{lsTaskId}/annotations\"\n  ls -> lsClient: \"{ id, result, lead_time }\"\n  lsClient -> svc: \"JsonNode (lỗi -> LabelStudioException 502/503)\"\n\n  svc -> annRepo: \"7a. save(TaskAnnotation)\"\n  annRepo -> db: \"INSERT task_annotations\"\n  svc -> assignedRepo: \"7b. status = ANNOTATED\"\n  assignedRepo -> db: \"UPDATE assigned_tasks\"\n  svc -> taskRepo: \"7c. incrementAnnotationCount\"\n  taskRepo -> db: \"UPDATE tasks SET annotation_count += 1\"\n  svc -> taskRepo: \"7d. đủ overlap -> updateTaskStatus(COMPLETED)\"\n  taskRepo -> db: \"UPDATE tasks\"\n\n  svc -> redis: \"8. enqueueWatchlist(userId) — HSET\"\n}\n\nsvc -> ctrl: \"CreateAnnotationResponse { id, result }\"\nctrl -> app: \"200 GetMethodResponse\"\n"},{"path":"flows/03-label-studio-webhook.d2","type":"d2","group":"flows","title":"Label Studio Webhook","content":"# Flow 3 — Label Studio Webhook\n# Render: https://play.d2lang.com/\n\nshape: sequence_diagram\n\nls: Label Studio\nctrl: LsWebhookController\npool: \"lsSyncExecutor (core 3, max 20, queue 100, CallerRunsPolicy)\"\nsync: SyncServiceImpl\nmatcher: ProjectTemplateMatcher\nprojectRepo: ProjectRepository\ntaskRepo: TaskRepository\nassignedRepo: AssignedTaskRepository\ndb: MariaDB\n\nls -> ctrl: \"POST /internal/webhooks/label-studio (LsWebhookPayload)\"\nctrl -> ctrl: \"objectMapper.readValue — parse fail = 400\"\nctrl -> pool: \"dispatch @Async theo payload.action\"\nctrl -> ls: \"200 OK NGAY (không chờ xử lý)\"\n\nPROJECT_CREATED_hoặc_UPDATED: {\n  pool -> sync: \"handleProjectCreated / handleProjectUpdated\"\n  sync -> matcher: \"resolve(label_config XML)\"\n  matcher -> sync: \"MatchContext { templateId, matchStatus, logicSignature }\"\n  sync -> projectRepo: \"insertIfAbsent / updateFromWebhook\\nMATCHED -> ACTIVE, else INACTIVE\"\n  projectRepo -> db: \"INSERT IGNORE / UPDATE projects\"\n  sync -> sync: \"labelConfigResolver.evictByLsProjectId()\"\n}\n\nTASK_CREATED: {\n  pool -> sync: \"handleTasksCreated(lsProjectId, tasks)\"\n  sync -> projectRepo: \"findByLsProjectId\"\n  projectRepo -> sync: \"null -> log.warn + return (reconcile sẽ chữa)\"\n  sync -> taskRepo: \"insertIfAbsent (INSERT IGNORE, idempotent)\\nMATCHED -> AVAILABLE, else UNAVAILABLE\"\n  taskRepo -> db: \"INSERT IGNORE tasks\"\n}\n\nTASK_DELETED: {\n  pool -> sync: \"handleTasksDeleted(tasks)\"\n  sync -> assignedRepo: \"cancelActiveByLsTaskIds — HUỶ ASSIGNMENT TRƯỚC\"\n  assignedRepo -> db: \"UPDATE assigned_tasks SET status = CANCELLED\"\n  sync -> taskRepo: \"markLsDeletedByLsIds — rồi mới đánh dấu xoá\"\n  taskRepo -> db: \"UPDATE tasks SET ls_deleted = true\"\n}\n"},{"path":"flows/04-reconciliation.d2","type":"d2","group":"flows","title":"Reconciliation","content":"# Flow 4 — Reconciliation (cron 0 */3 * * * *)\n# Render: https://play.d2lang.com/\n\nshape: sequence_diagram\n\nsched: \"Spring Scheduler\"\njob: ReconciliationJob\nsync: SyncServiceImpl\nlsClient: LabelStudioClient\nls: Label Studio\nlogRepo: SyncJobLogRepository\nprojectRepo: ProjectRepository\ntaskRepo: TaskRepository\nassignedRepo: AssignedTaskRepository\ndb: MariaDB\n\nsched -> job: \"run() — cron sync.reconciliation.cron\"\n\nBuoc_1_reconcileProjects: {\n  job -> sync: reconcileProjects()\n  sync -> logRepo: \"SyncJobLog.start(SCHEDULED, PROJECT, RECONCILE)\"\n  sync -> lsClient: \"getProjects(page, pageSize=50) — lặp tới hết, sleep 200ms/trang\"\n  lsClient -> ls: \"GET /api/projects\"\n  ls -> sync: \"LsProjectPageResponse\"\n  sync -> sync: \"SAFETY: rỗng -> ABORT, ghi 'empty list from LS'\"\n  sync -> projectRepo: \"findAllActiveLsIds()\"\n  sync -> sync: \"DIFF: toInsert / toUpdate / toDelete\"\n  sync -> projectRepo: \"insertIfAbsent / updateFromWebhook / markLsDeletedByLsIds\"\n  projectRepo -> db: \"INSERT IGNORE / UPDATE projects\"\n  sync -> logRepo: \"SUCCESS + counters\"\n  sync -> job: \"ReconcileResult (exception -> job RETURN ngay)\"\n}\n\nBuoc_2_tasks_cua_project_da_xoa: {\n  job -> sync: reconcileTasksForLsDeletedProjects()\n  sync -> assignedRepo: cancelActiveByProjectIds\n  sync -> taskRepo: markLsDeletedByProjectIds\n  sync -> job: \"exception -> log.error + TIẾP TỤC\"\n}\n\nBuoc_3_tasks_tung_project_ACTIVE: {\n  job -> projectRepo: findAllActiveLsIds()\n  job -> sync: \"reconcileTasksForProject(lsProjectId) — vòng lặp\"\n  sync -> lsClient: \"getTasksByProject(id, page, 50)\"\n  lsClient -> ls: \"GET /api/tasks?project=\"\n  ls -> sync: \"LsTaskPageResponse { tasks, total }\"\n  sync -> sync: \"SAFETY: rỗng + total=0 -> tin; rỗng + total khác -> ABORT\"\n  sync -> assignedRepo: \"cancelActiveByLsTaskIds (TRƯỚC)\"\n  sync -> taskRepo: \"insertIfAbsent / updateByLsTaskId / markLsDeletedByLsIds\"\n  taskRepo -> db: \"INSERT IGNORE / UPDATE tasks\"\n  sync -> job: \"1 project lỗi -> projectsFailed++, TIẾP TỤC\"\n}\n\njob -> job: \"log tổng kết projects(i,u,d) tasks(i,u,d) taskProjects(ok,fail)\"\n"},{"path":"flows/05-assignment-expiry.d2","type":"d2","group":"flows","title":"Assignment Expiry","content":"# Flow 5 — Assignment Expiry (cron 0 0/10 * * * *)\n# Render: https://play.d2lang.com/\n\nshape: sequence_diagram\n\nsched: \"Spring Scheduler\"\njob: AssignmentExpiryJob\nassignedRepo: AssignedTaskRepository\ntaskRepo: TaskRepository\ncache: TaskRecommendationCacheServiceImpl\nredis: Redis\ndb: MariaDB\n\nsched -> job: \"run() — cron assignment.expiry.cron\"\n\njob -> assignedRepo: \"findDistinctUserIdsPendingExpiredBefore(now)\"\nassignedRepo -> db: \"SELECT DISTINCT user_id WHERE status=PENDING AND expired_at \u003c now\"\ndb -> job: \"List\u003cUUID> — PHẢI đọc TRƯỚC khi update\"\n\njob -> assignedRepo: \"markExpiredBefore(now)\"\nassignedRepo -> db: \"UPDATE assigned_tasks SET status='EXPIRED'\\nWHERE status='PENDING' AND expired_at \u003c now\"\ndb -> job: \"số row bị đổi\"\n\njob -> taskRepo: \"revertToAvailableWhereNoPending(now)\"\ntaskRepo -> db: \"UPDATE tasks SET task_status='AVAILABLE'\\nWHERE IN_PROGRESS AND không còn PENDING\\nAND COUNT(ANNOTATED) \u003c overlap\"\n\njob -> cache: \"enqueueWatchlist(userId) cho từng user bị ảnh hưởng\"\ncache -> redis: \"HSET questlab:recommendations:watchlist\"\n"},{"path":"flows/06-task-import-async.d2","type":"d2","group":"flows","title":"Task Import Async","content":"# Flow 6 — Task Import Portal ASYNC\n# Render: https://play.d2lang.com/\n\nshape: sequence_diagram\n\nadmin: Admin Portal\nctrl: TaskImportController\nsvc: TaskImportServiceImpl\nstorage: \"ImportFileStorage (FILE_SERVICE | LOCAL)\"\njobRepo: TaskImportJobRepository\nworker: TaskImportWorkerJob\njobSvc: TaskImportJobService\nparser: TaskImportParserFactory\nplanner: ImportItemPlanner\nlsImport: LabelStudioImportClient\nls: Label Studio\nmirror: \"ImportMirrorExecutor / TaskMirrorServiceImpl\"\ndb: MariaDB\n\nadmin -> ctrl: \"POST /projects/{uuid}/task-imports (multipart)\"\nctrl -> svc: createImport\nsvc -> svc: \"ProjectReadinessValidator + TaskImportFileValidator\"\nsvc -> storage: \"store(file)\"\nsvc -> jobRepo: \"INSERT task_import_jobs (PENDING, PORTAL_UPLOAD, ASYNC)\"\njobRepo -> db: INSERT\nsvc -> admin: \"202-style: trả jobUuid ngay\"\n\nWorker_scan_moi_10s: {\n  worker -> jobRepo: \"reclaimStaleQueued() — QUEUED quá 15' -> re-arm\"\n  worker -> jobRepo: \"findByStatusIn([PENDING, RETRYING, WAITING], top 20)\"\n  worker -> jobSvc: \"claimStatus(jobId, entry, QUEUED) — COMPARE-AND-SET\"\n  jobSvc -> db: \"UPDATE ... WHERE id=? AND status=?\"\n  db -> worker: \"0 row -> instance khác đã thắng, skip\"\n\n  worker -> parser: \"LabelConfigDataKeyResolver + parse JSON/CSV/TSV/TXT\"\n  worker -> planner: \"ExecutionPlan — retry chỉ gửi item chưa có ls_task_id\"\n  worker -> lsImport: \"importTasks(...)\"\n  lsImport -> ls: \"POST /api/projects/{id}/import\"\n  ls -> lsImport: \"importId (nếu async)\"\n  lsImport -> ls: \"GET /api/projects/{id}/imports/{importId} — poll 3s, timeout 600s\"\n  worker -> mirror: \"mirror task về local\"\n  mirror -> db: \"INSERT tasks + task_import_items.ls_task_id\"\n  worker -> jobRepo: \"status = COMPLETED | PARTIAL_FAILED | FAILED_RETRYABLE\"\n}\n\nadmin -> ctrl: \"GET /task-import-jobs/{uuid} + /items\"\nadmin -> ctrl: \"POST /task-import-jobs/{uuid}/retry -> RETRYING\"\n"},{"path":"flows/07-external-storage-import.d2","type":"d2","group":"flows","title":"External Storage Import","content":"# Flow 7 — External Storage Scheduled Import (cron 0 * * * * *)\n# Render: https://play.d2lang.com/\n\nshape: sequence_diagram\n\nsched: \"Spring Scheduler\"\ntick: ExternalStorageSchedulerTick\nschedRepo: ExternalStorageScheduleRepository\nevaluator: \"ScheduleFireEvaluator + CronCompiler\"\nrunSvc: ExternalStorageRunService\nscanSvc: ExternalStorageScanService\nregistry: ExternalStorageProviderRegistry\ncipher: AesGcmSecretCipher\nprovider: \"S3 / MinIO / SFTP\"\nfactory: ExternalImportJobFactory\narchive: ExternalStorageArchiveService\nworker: TaskImportWorkerJob\ndb: MariaDB\n\nsched -> tick: \"tick() — @ConditionalOnProperty external-storage.enabled=true\"\ntick -> schedRepo: findAllEnabled()\nschedRepo -> db: \"SELECT external_storage_schedules\"\ndb -> tick: \"List\u003cExternalStorageSchedule>\"\n\nVoi_moi_schedule: {\n  tick -> evaluator: \"evaluate(schedule, now)\"\n  evaluator -> tick: \"FireDecision { shouldFire, reason } — false thì SKIP\"\n\n  tick -> runSvc: \"createRun(schedule, RunTriggerSource.SCHEDULE)\"\n  runSvc -> db: \"INSERT external_storage_runs (CREATED)\"\n  runSvc -> tick: \"SKIPPED_ALREADY_RUNNING / SKIPPED_DISABLED -> dừng\"\n\n  tick -> scanSvc: \"scan(schedule, run)\"\n  scanSvc -> registry: \"resolve provider theo ExternalProviderType\"\n  registry -> cipher: \"giải mã credential (DbBacked) hoặc đọc env (EnvBacked)\"\n  registry -> provider: \"list(prefix)\"\n  provider -> scanSvc: \"danh sách file + batch folder\"\n  scanSvc -> scanSvc: \"đọc manifest + ExternalStorageCompatibilityValidator\"\n  scanSvc -> db: \"INSERT external_import_batches\"\n  scanSvc -> factory: \"tạo job cho từng batch\"\n  factory -> db: \"INSERT task_import_jobs (EXTERNAL_STORAGE_SCHEDULED, PENDING)\"\n  scanSvc -> archive: \"move file đã xử lý\"\n  archive -> provider: \"{root}/{projectUuid}/{yyyy}/{MM}/{dd}/{batchId}/{relative}\"\n  scanSvc -> db: \"run status -> REGISTERED_BATCHES / COMPLETED\"\n}\n\nworker -> db: \"nhặt task_import_jobs PENDING (Flow 6)\"\n"},{"path":"flows/08-payout-request-to-paid.d2","type":"d2","group":"flows","title":"Payout Request To Paid","content":"# Flow 8 — Payout: request -> paid\n# Render: https://play.d2lang.com/\n\nshape: sequence_diagram\n\nuser: Annotator\naccountant: \"Kế toán / Admin\"\nreqCtrl: PayoutRequestController\nadminCtrl: PayoutRequestAdminController\nreqSvc: PayoutRequestServiceImpl\nprocSvc: PayoutProcessingServiceImpl\nsm: \"PayoutStateMachine (static)\"\nledger: CompensationLedgerWriter\nsumRepo: UserCompensationSummaryRepository\nreqRepo: PayoutRequestRepository\noutbox: \"PayoutNotificationRepository (outbox)\"\njob: PayoutNotificationDispatchJob\nnotif: notification-service\ndb: MariaDB\n\nTao_yeu_cau_rut: {\n  user -> reqCtrl: \"POST /payout-requests\"\n  reqCtrl -> reqSvc: \"createRequest — @Transactional\"\n  reqSvc -> ledger: \"lockOrCreateSummary(userId, currency)\"\n  ledger -> sumRepo: \"lockByUserIdAndCurrency — PESSIMISTIC_WRITE (khoá 1)\"\n  sumRepo -> db: \"SELECT ... FOR UPDATE\"\n  reqSvc -> reqSvc: \"re-check available BÊN TRONG khoá\"\n  reqSvc -> reqRepo: \"INSERT payout_requests (PENDING)\"\n  reqSvc -> ledger: \"apply(PAYOUT_RESERVE, key = PAYOUT_RESERVE:...)\"\n  ledger -> db: \"available -= amount, pending += amount\\n(thiếu -> INSUFFICIENT_AVAILABLE)\"\n}\n\nKe_toan_bat_dau_xu_ly: {\n  accountant -> adminCtrl: \"POST /admin/payout-requests/{uuid}/start-processing\"\n  adminCtrl -> procSvc: \"@Transactional\"\n  procSvc -> reqRepo: \"lockByUuid — PESSIMISTIC_WRITE (khoá 1: request)\"\n  procSvc -> sm: \"PENDING -> PROCESSING ?\"\n  sm -> procSvc: \"hợp lệ, MonetaryEffect = NONE\"\n  procSvc -> db: \"UPDATE status + INSERT payout_attempts (IN_PROGRESS)\"\n}\n\nKe_toan_danh_dau_da_chi: {\n  accountant -> adminCtrl: \"POST /admin/payout-requests/{uuid}/mark-paid\"\n  adminCtrl -> procSvc: \"@Transactional\"\n  procSvc -> reqRepo: \"lockByUuid (khoá 1: request)\"\n  procSvc -> sm: \"PROCESSING -> PAID ?\"\n  sm -> procSvc: \"hợp lệ, MonetaryEffect = SETTLEMENT\"\n  procSvc -> ledger: \"apply(PAYOUT_SETTLEMENT)\"\n  ledger -> sumRepo: \"lock summary (khoá 2 — THỨ TỰ CỐ ĐỊNH, không deadlock)\"\n  ledger -> db: \"pending -= amount, totalPaid += amount\\n(available KHÔNG đổi — đã trừ lúc RESERVE)\"\n  procSvc -> db: \"payout_attempts -> SUCCESS\"\n  procSvc -> outbox: \"INSERT payout_notifications (PENDING)\"\n}\n\nOutbox_dispatch: {\n  job -> outbox: \"reclaimStale() — SENDING kẹt -> PENDING\"\n  job -> outbox: \"dispatchBatch()\"\n  job -> notif: \"NotificationClient push/mail\"\n  notif -> job: \"SENT | FAILED | SKIPPED\"\n  job -> job: \"RuntimeException bị nuốt — row vẫn trong outbox\"\n}\n"},{"path":"flows/09-partner-sdk.d2","type":"d2","group":"flows","title":"Partner Sdk","content":"# Flow 9 — Partner SDK (init -> request -> submit)\n# Render: https://play.d2lang.com/\n\nshape: sequence_diagram\n\npartner: \"Partner backend\"\ngw: \"API Gateway\"\nauthsvc: auth-service\nfilter: IntegrationPartnerFilter\nverifier: JwtVerifier\nctrl: IntegrationController\nuserSync: PartnerUserSyncServiceImpl\ntaskSync: PartnerTaskSyncServiceImpl\nannSync: PartnerAnnotationSyncServiceImpl\ndist: TaskDistributionServiceImpl\ntaskRepo: TaskRepository\nlogSvc: IntegrationTransactionLogService\ndb: MariaDB\n\npartner -> gw: \"x-api-key + transactionId\"\ngw -> authsvc: \"đổi x-api-key thành JWT\"\nauthsvc -> gw: \"JWT (ttl = -1, không có exp)\"\ngw -> filter: \"Bearer JWT (gateway STRIP Authorization của client)\"\n\nFilter_xac_dinh_partner: {\n  filter -> verifier: \"verifyAndGetClaims — HS256, allowlist 1 alg, constant-time compare\"\n  filter -> db: \"JWT.sub -> auth_client.owner_id -> integration_partners.auth_client_id\"\n  filter -> filter: \"X-Partner-Code khác -> 403 PARTNER_CODE_MISMATCH\"\n  filter -> filter: \"thiếu transactionId -> 400 TRANSACTION_ID_REQUIRED\"\n  filter -> filter: \"PartnerContext.set + TransactionContext.set (clear ở finally)\"\n}\n\nBuoc_1_init_user: {\n  filter -> ctrl: \"POST /integration/users/init\"\n  ctrl -> ctrl: \"verifyPermission(INTEGRATION_USER_INIT)\"\n  ctrl -> userSync: initUser\n  userSync -> authsvc: \"provisionUser — tạo user + user_profile + member_profile\"\n  userSync -> authsvc: \"provisionUserWithSession — lấy phiên\"\n  userSync -> db: \"INSERT partner_user_mappings\"\n}\n\nBuoc_2_request_task: {\n  filter -> ctrl: \"POST /integration/tasks/request\"\n  ctrl -> ctrl: \"verifyPermission(INTEGRATION_TASK_REQUEST)\"\n  ctrl -> taskSync: requestTask\n  taskSync -> db: \"externalUserId có -> mapping bắt buộc (else USER_NOT_INITIALIZED)\\nrỗng -> pool __PARTNER_POOL__\"\n  taskSync -> dist: \"assignAnyAvailableTask(questlabUserId)\"\n  dist -> taskRepo: \"findNextAvailableTaskIdOutsideGatedCampaigns(userId) — FOR UPDATE\"\n  taskRepo -> db: \"JOIN projects + overlap + user dedup + loại campaign gated\"\n  dist -> db: \"INSERT assigned_tasks (PENDING) + tasks -> IN_PROGRESS\"\n  taskSync -> logSvc: \"logAssignment SUCCESS/FAILED\"\n  logSvc -> db: \"INSERT integration_transaction_logs\"\n}\n\nBuoc_3_submit: {\n  filter -> ctrl: \"POST /integration/tasks/{assignedTaskId}/submit\"\n  ctrl -> ctrl: \"verifyPermission(INTEGRATION_ANNOTATION_SUBMIT)\"\n  ctrl -> annSync: \"submitAnnotation — giống Flow 2\"\n  annSync -> logSvc: \"ghi log đối soát\"\n}\n"},{"path":"flows/10-media-signed-url.d2","type":"d2","group":"flows","title":"Media Signed Url","content":"# Flow 10 — Media signed URL\n# Render: https://play.d2lang.com/\n\nshape: sequence_diagram\n\napp: Mobile App\ntaskCtrl: TaskController\ntaskSvc: TaskServiceImpl\nlsClient: LabelStudioClient\nsigning: MediaSigningServiceImpl\nmediaCtrl: MediaController\nmediaSvc: MediaServiceImpl\nls: Label Studio\nstorage: \"S3 / MinIO / LS storage\"\n\nBuoc_1_lay_task_va_ky_URL: {\n  app -> taskCtrl: \"GET /tasks/{taskId}\"\n  taskCtrl -> taskSvc: \"getTaskById(userId, taskId)\"\n  taskSvc -> lsClient: \"getTaskById(lsTaskId)\"\n  lsClient -> ls: \"GET /api/tasks/{id} (header Token)\"\n  ls -> taskSvc: \"data gốc — URL trỏ vào LS, app KHÔNG gọi được (401)\"\n  taskSvc -> signing: \"sign(path, userId)\"\n  signing -> taskSvc: \"/media/{path}?expires=..&signature=HMAC-SHA256(path|userId|expires)\"\n  taskSvc -> app: \"task data với URL đã ký (TTL 10 phút)\"\n}\n\nBuoc_2_tai_file: {\n  app -> mediaCtrl: \"GET /media/**?expires&signature (kèm Authorization)\"\n  mediaCtrl -> mediaCtrl: \"CurrentUserFilter BỎ QUA (/media/ nằm trong WHITE_LIST)\"\n  mediaCtrl -> mediaCtrl: \"checkAuthorization + getUserUUIDFromToken -> tokenUserId\"\n  mediaCtrl -> mediaCtrl: \"extractSignedPath — cắt theo indexOf('/media/')\"\n  mediaCtrl -> mediaSvc: \"getMedia(path, tokenUserId, expires, signature, response)\"\n  mediaSvc -> signing: \"isValid(...)\"\n  signing -> mediaSvc: \"sai chữ ký / hết hạn / userId khác -> 403\"\n  mediaSvc -> ls: \"HttpURLConnection + header Token (CHỈ khi protocol+host+port == LS)\"\n  ls -> mediaSvc: \"303 redirect\"\n  mediaSvc -> storage: \"follow redirect (tối đa 5) — KHÔNG kèm token LS\"\n  storage -> mediaSvc: \"bytes\"\n  mediaSvc -> app: \"stream nội dung\"\n}\n"},{"path":"flows/main-business-flows.md","type":"md","group":"flows","title":"Main Business Flows — trace từ Controller đến Database / External System","content":"# Main Business Flows — trace từ Controller đến Database / External System\n\nMỗi flow dưới đây có một file `.d2` sequence diagram tương ứng trong cùng thư mục.\nTất cả tên class/method là **tên thật trong source**.\n\n| # | Flow | File D2 |\n|---|---|---|\n| 1 | Request Task (user xin việc) | `01-request-task.d2` |\n| 2 | Submit Annotation | `02-submit-annotation.d2` |\n| 3 | Label Studio Webhook | `03-label-studio-webhook.d2` |\n| 4 | Reconciliation (scheduler) | `04-reconciliation.d2` |\n| 5 | Assignment Expiry (scheduler) | `05-assignment-expiry.d2` |\n| 6 | Task Import — Portal ASYNC | `06-task-import-async.d2` |\n| 7 | External Storage Scheduled Import | `07-external-storage-import.d2` |\n| 8 | Payout: request → paid | `08-payout-request-to-paid.d2` |\n| 9 | Partner SDK: init → request → submit | `09-partner-sdk.d2` |\n| 10 | Media signed URL | `10-media-signed-url.d2` |\n\n---\n\n## Flow 1 — Request Task\n\n**Trigger:** user bấm \"Nhận việc\" trên app.\n\n```\nPOST /assignments/request\nAuthorization: Bearer \u003cJWT>\n```\n\n```\nCurrentUserFilter.doFilterInternal\n  authClient.getUserUUIDFromToken(request)         → UUID (từ claim \"sub\")\n  CurrentUserContext.set(userId)                   ← dùng cho JPA auditing (creator_id)\n      ↓\nAssignmentController.requestTask\n  authClient.checkAuthorization(servletRequest)    → thiếu header = ProxyAuthenticationException\n  userId = authClient.getUserUUIDFromToken(...)\n      ↓\nTaskDistributionServiceImpl.requestTask(userId)    @Transactional  ◄── TX BẮT ĐẦU\n  │\n  ├─1─ assignedTaskRepository.countActiveByUserId(userId)\n  │       SELECT COUNT(a) FROM AssignedTask a WHERE userId=? AND status='PENDING'\n  │       >= assignment.max-concurrent-tasks (10) → return \"You have reached the maximum...\"\n  │\n  ├─2─ authProfileClient.getUserProfile(userId)     → HTTP GET auth-service /member-profile\n  │       lỗi → AuthProfileUnavailableException → 503 (KHÔNG gán bừa)\n  │\n  ├─3─ profileContextBuilder.build(profile)         → AssignmentProfileContext (map phẳng)\n  │\n  ├─4─ projectEligibilityService.findEligibleProjects(userId, context)\n  │       projectRepository.findActiveAssignableProjects(ACTIVE, MATCHED, now)\n  │       for each project:\n  │           policyService.getEnabledCompiledPolicy(projectId)\n  │           empty  → eligible (emptyPolicyStrategy = ALLOW, §16.1)\n  │           có     → policyEvaluator.evaluate(compiled, context)\n  │       rỗng → return \"No eligible projects for current user profile.\"\n  │\n  ├─5─ qualificationAssignmentGate.blockedProjectIds(userId, projectIds)\n  │       campaignProjectRepository.findActiveCampaignLinksByProjectIds(...)\n  │       configRepository.findFirstByCampaignIdAndFrozenTrue...(campaignId)\n  │       attemptRepository.existsBy...(configId, userId, PASSED)\n  │       loại project bị chặn; rỗng hết → return \"You must pass the campaign qualification test...\"\n  │\n  ├─6─ taskRepository.findNextAssignableTaskId(userId, eligibleProjectIds)\n  │       native SQL ... ORDER BY (IN_PROGRESS trước), id ASC LIMIT 1 FOR UPDATE   ◄── KHOÁ ROW\n  │       taskRepository.findById(id)\n  │       empty → return \"No tasks available for eligible projects.\"\n  │\n  ├─7─ createAssignment(task, userId, context, matchedProject)\n  │       assignedTaskRepository.save(AssignedTask{\n  │           status=PENDING, assignedAt=now,\n  │           expiredAt = now + assignment.expiry.minutes (4320' = 3 ngày),\n  │           profileContextJson, matchedPolicyVersion, matchedPolicyHash, matchReasonJson })\n  │\n  └─8─ updateTaskStatusIfNeeded(task)\n          nếu AVAILABLE → taskRepository.updateTaskStatus(id, IN_PROGRESS, now)\n                                                                   ◄── TX COMMIT (nhả row lock)\n      ↓\nGetMethodResponse{ status:true, httpCode:200, message: result.message,\n                   data: AssignedTaskResponse{assignedTaskId, taskUuid, projectUuid} }\n```\n\n**Lưu ý:** khi không có task, HTTP vẫn **200** và `data = null`; lý do nằm ở `message`.\n\n---\n\n## Flow 2 — Submit Annotation\n\n```\nPOST /annotations?assignedTaskId={uuid}\n      ↓\nAnnotationController.createNewAnnotation\n      ↓\nAnnotationServiceImpl.createAnnotation   @Transactional   ◄── TX BẮT ĐẦU\n  1. assignedTaskRepository.findByUuidAndStatus(assignedTaskId, PENDING)\n        → ResourceNotFoundException \"No active assignment found for this task.\"\n  2. expiredAt \u003c now                → BadRequestException \"Assignment has expired\"\n  3. assignedTask.userId != userId  → UnAuthorizedException \"You have not permission.\"\n  4. taskRepository.findById(...); task.status == UNAVAILABLE → BadRequestException\n  5. validationOrchestrator.validate(request, task.projectId)\n        → LabelConfigResolver (cache theo lsProjectId) → contract từ label_config XML\n        → sai → AnnotationValidationException (trả kèm danh sách lỗi path/code/message)\n  6. labelStudioClient.createAnnotation(payload, task.lsTaskId)\n        POST {label-studio.base-url}/api/tasks/{lsTaskId}/annotations\n        header: Authorization: Token \u003caccess-token>\n        lỗi → LabelStudioException → GlobalExceptionHandler → 502/503\n  7. saveAnnotationAndUpdateStatus(...)\n        INSERT task_annotations (lsAnnotationId, resultJson, leadTime, submittedAt)\n        assigned_tasks.status = ANNOTATED\n        tasks.annotation_count += 1\n        (annotation_count + 1) >= tasks.overlap → tasks.task_status = COMPLETED\n        partnerLabelingEventService.recordTaskSubmitted(...)   ← no-op với user thường\n  8. recommendationCacheService.enqueueWatchlist(userId)       ← Redis HSET\n                                                             ◄── TX COMMIT\n```\n\n**Xử lý lỗi:** toàn bộ block 5-8 nằm trong `try/catch`; catch gọi\n`partnerLabelingEventService.recordTaskFailed(...)` rồi **rethrow**.\n\n⚠️ Bước 6 là HTTP call (timeout tối đa 120 s) **bên trong transaction** — DB connection bị giữ\nsuốt thời gian đó.\n\n---\n\n## Flow 3 — Label Studio Webhook\n\n```\nLabel Studio ──► POST /internal/webhooks/label-studio   (body: LsWebhookPayload JSON)\n      ↓\nLsWebhookController.receive(String rawBody)\n  objectMapper.readValue(rawBody, LsWebhookPayload.class)   → parse fail = 400\n  switch (payload.action):\n      PROJECT_CREATED  → syncService.handleProjectCreated(payload.project)\n      PROJECT_UPDATED  → syncService.handleProjectUpdated(payload.project)\n      PROJECT_DELETED  → syncService.handleProjectDeleted(payload.project.id)\n      TASK_CREATED     → syncService.handleTasksCreated(projectId, tasks)\n      TASK_DELETED     → syncService.handleTasksDeleted(tasks)\n      default          → log.warn \"ignored webhook action\"\n  return 200 OK                                            ◄── TRẢ NGAY, không chờ\n      ↓ (thread pool lsSyncExecutor: core 3, max 20, queue 100, CallerRunsPolicy)\nSyncServiceImpl.handleProjectCreated  @Async(\"lsSyncExecutor\")\n  match = projectTemplateMatcher.resolve(dto.labelConfig)\n  projectStatus = MATCHED ? ACTIVE : INACTIVE\n  projectRepository.insertIfAbsent(...)        ← native INSERT IGNORE (idempotent)\n\nSyncServiceImpl.handleTasksCreated  @Async\n  project = projectRepository.findByLsProjectId(lsProjectId)\n      null → log.warn + return                 ← task đến trước project thì bỏ, reconcile sẽ chữa\n  taskStatus = project MATCHED ? AVAILABLE : UNAVAILABLE\n  for each task: taskRepository.insertIfAbsent(...)\n\nSyncServiceImpl.handleTasksDeleted  @Async\n  assignedTaskRepository.cancelActiveByLsTaskIds(ids)   ← HUỶ ASSIGNMENT TRƯỚC\n  taskRepository.markLsDeletedByLsIds(ids, now)         ← rồi mới đánh dấu xoá\n```\n\n---\n\n## Flow 4 — Reconciliation\n\n```\n@Scheduled(cron = \"${sync.reconciliation.cron}\")   0 */3 * * * *  (3 phút)\nReconciliationJob.run()\n  │\n  ├── syncService.reconcileProjects()\n  │      syncJobLogRepository.save(SyncJobLog.start(\"SCHEDULED\",\"PROJECT\",\"RECONCILE\"))\n  │      FETCH:  labelStudioClient.getProjects(page, size=50)  lặp tới hết, sleep 200ms/trang\n  │      SAFETY: rỗng → errorMessage \"empty list from LS — aborted\", return (0,0,0,0)\n  │      DIFF:   toInsert = lsIds - dbIds ; toUpdate = ∩ ; toDelete = dbIds - lsIds\n  │      APPLY:  insertIfAbsent / updateFromWebhook (+ labelConfigResolver.evictByLsProjectId)\n  │              markLsDeletedByLsIds(toDelete)\n  │      LOG:    sync_job_log status=SUCCESS + counters\n  │      exception → return NGAY (bỏ luôn task reconcile)\n  │\n  ├── syncService.reconcileTasksForLsDeletedProjects()\n  │      cancelActiveByProjectIds + markLsDeletedByProjectIds\n  │      exception → log.error, TIẾP TỤC\n  │\n  └── for lsProjectId in projectRepository.findAllActiveLsIds():\n         syncService.reconcileTasksForProject(lsProjectId)\n            FETCH:  labelStudioClient.getTasksByProject(...) lặp tới hết\n            SAFETY: rỗng + reportedTotal == 0 → tin, xoá local\n                    rỗng + reportedTotal khác → ABORT\n            DIFF + APPLY (cancelActiveByLsTaskIds TRƯỚC markLsDeletedByLsIds)\n         exception 1 project → projectsFailed++, TIẾP TỤC\n```\n\n---\n\n## Flow 5 — Assignment Expiry\n\n```\n@Scheduled(cron = \"${assignment.expiry.cron}\")   0 0/10 * * * *\nAssignmentExpiryJob.run()\n  now = new Date()\n  affectedUserIds = assignedTaskRepository.findDistinctUserIdsPendingExpiredBefore(now)\n        ← PHẢI đọc trước, sau update sẽ không còn row PENDING nào\n  expired = assignedTaskRepository.markExpiredBefore(now)\n        UPDATE AssignedTask SET status='EXPIRED'\n        WHERE isDeleted=false AND status='PENDING' AND expiredAt \u003c :now\n  if expired > 0:\n      reverted = taskRepository.revertToAvailableWhereNoPending(now)\n        UPDATE tasks SET task_status='AVAILABLE'\n        WHERE task_status='IN_PROGRESS' AND alive\n          AND NOT EXISTS (assignment PENDING nào)\n          AND (COUNT assignment ANNOTATED) \u003c t.overlap\n      for userId in affectedUserIds: recommendationCacheService.enqueueWatchlist(userId)\n```\n\n---\n\n## Flow 6 — Task Import (Portal, ASYNC)\n\n```\nPOST /projects/{projectUuid}/task-imports  (multipart)\n      ↓ TaskImportController.createImport → TaskImportServiceImpl\n  ProjectReadinessValidator / TaskImportFileValidator\n  ImportFileStorage.store(...)  → FILE_SERVICE hoặc LOCAL\n  INSERT task_import_jobs (status = PENDING, source = PORTAL_UPLOAD, mode = ASYNC)\n  → trả jobUuid ngay\n      ↓ (≤10 s sau)\n@Scheduled(fixedDelay 10s) TaskImportWorkerJob.scan()\n  reclaimStaleQueued()          ← job QUEUED quá 15' → re-arm (WAITING nếu có lsImportId, else PENDING)\n  jobRepository.findByStatusIn([PENDING, RETRYING, WAITING_LABEL_STUDIO_IMPORT], top 20)\n  for each job:\n      jobService.claimStatus(jobId, entry, QUEUED)     ← COMPARE-AND-SET, thua thì skip\n      processJob(jobId, entry)   → dispatch vào lsSyncExecutor\n          LabelConfigDataKeyResolver → data key bắt buộc từ label_config\n          TaskImportParserFactory    → parse JSON/CSV/TSV/TXT\n          ImportItemPlanner          → ExecutionPlan (tái dùng item cũ khi retry)\n          LabelStudioImportClient.importTasks → POST /api/projects/{id}/import\n              LS async → status = WAITING_LABEL_STUDIO_IMPORT\n                         poll GET /api/projects/{id}/imports/{importId}\n                         (interval 3 s, timeout 600 s)\n          ImportMirrorExecutor → TaskMirrorServiceImpl → INSERT tasks local\n          status = COMPLETED | PARTIAL_FAILED | FAILED_RETRYABLE | FAILED_PERMANENT\n      ↓\nGET /task-import-jobs/{jobUuid}          → trạng thái + counters\nGET /task-import-jobs/{jobUuid}/items    → từng dòng + lỗi\nPOST /task-import-jobs/{jobUuid}/retry   → status = RETRYING\n```\n\n---\n\n## Flow 7 — External Storage Scheduled Import\n\n```\n@Scheduled(cron 0 * * * * *)  ExternalStorageSchedulerTick.tick()\n  @ConditionalOnProperty task-import.external-storage.enabled = true\n  scheduleRepository.findAllEnabled()\n  for each schedule:\n      fireEvaluator.evaluate(schedule, now)    → FireDecision(shouldFire, reason)\n      không đến giờ → log.trace SKIP\n      đến giờ:\n        run = runService.createRun(schedule, RunTriggerSource.SCHEDULE)\n              status SKIPPED_ALREADY_RUNNING / SKIPPED_DISABLED → return\n        scanService.scan(schedule, run)\n            ExternalStorageProviderRegistry → S3ExternalStorageProvider\n                                            | SftpExternalStorageProvider\n            credential: EnvBacked... hoặc DbBacked... (AesGcmSecretCipher giải mã)\n            list file → phát hiện batch folder → đọc manifest\n            ExternalStorageCompatibilityValidator\n            INSERT external_import_batches\n            ExternalImportJobFactory → INSERT task_import_jobs\n                                       (source = EXTERNAL_STORAGE_SCHEDULED, PENDING)\n        → TaskImportWorkerJob nhặt lên (Flow 6)\n        → ExternalStorageArchiveService move file:\n             {root}/{projectUuid}/{yyyy}/{MM}/{dd}/{batchId}/{relative}\n```\n\n---\n\n## Flow 8 — Payout: request → paid\n\n```\n[USER]  POST /payout-requests\n   PayoutRequestServiceImpl.createRequest   @Transactional\n     ledgerWriter.lockOrCreateSummary(userId, currency)      ← PESSIMISTIC_WRITE (1)\n     re-check available BÊN TRONG khoá\n     INSERT payout_requests (status = PENDING)\n     ledgerWriter.apply(PAYOUT_RESERVE, key=\"PAYOUT_RESERVE:\u003c...>\")\n         available -= amount ; pending += amount\n         (available \u003c amount → CompensationException INSUFFICIENT_AVAILABLE)\n\n[ADMIN] POST /admin/payout-requests/{uuid}/start-processing\n   PayoutProcessingServiceImpl   @Transactional\n     requestRepository.lockByUuid(...)                       ← PESSIMISTIC_WRITE (1) request\n     PayoutStateMachine: PENDING → PROCESSING, effect = NONE\n     INSERT payout_attempts (IN_PROGRESS)\n\n[ADMIN] POST /admin/payout-requests/{uuid}/mark-paid\n     requestRepository.lockByUuid(...)                       ← (1) request\n     PayoutStateMachine: PROCESSING → PAID, effect = SETTLEMENT\n     ledgerWriter.apply(PAYOUT_SETTLEMENT, key=\"PAYOUT_SETTLEMENT:\u003c...>\")\n         lockOrCreateSummary                                 ← (2) summary  [thứ tự cố định]\n         pending -= amount ; totalPaid += amount ; available KHÔNG đổi\n     payout_attempts → SUCCESS\n     notificationEnqueuer → INSERT payout_notifications (PENDING)   ← OUTBOX\n\n[JOB]  @Scheduled(fixedDelay 30s) PayoutNotificationDispatchJob.run()\n     dispatcher.reclaimStale()    ← row kẹt SENDING → PENDING\n     dispatcher.dispatchBatch()   → NotificationClient → notification-service\n                                    (push FCM / mail) → SENT | FAILED | SKIPPED\n     RuntimeException bị nuốt có chủ ý — row vẫn nằm trong outbox\n```\n\n---\n\n## Flow 9 — Partner SDK\n\n```\nPartner backend ──(x-api-key + transactionId)──► API Gateway\nGateway: đổi x-api-key → JWT (auth-service), STRIP Authorization của client\n      ↓\nIntegrationPartnerFilter.doFilterInternal   (chỉ /integration/**)\n  authClient.getUserUUIDFromToken(request)     → ownerUuid = JWT.sub\n  partnerService.getByAuthClientOwnerUuid(ownerUuid)\n  X-Partner-Code không khớp → 403 PARTNER_CODE_MISMATCH\n  PartnerContext.set(partnerId, partnerCode)\n  transactionId = TransactionHeaderReader.read(request)\n      thiếu → 400 TRANSACTION_ID_REQUIRED\n  TransactionContext.set(transactionId)\n  finally { PartnerContext.clear(); TransactionContext.clear(); }\n      ↓\n[1] POST /integration/users/init\n      authClient.verifyPermission(..., INTEGRATION_USER_INIT)\n      PartnerUserSyncServiceImpl.initUser\n        authProfileClient.provisionUser(...)          ← tạo user + profile (BƯỚC 1)\n        authProfileClient.provisionUserWithSession()  ← lấy phiên      (BƯỚC 2)\n        INSERT partner_user_mappings (externalUserId ↔ questlabUserId)\n\n[2] POST /integration/tasks/request\n      authClient.verifyPermission(..., INTEGRATION_TASK_REQUEST)\n      PartnerTaskSyncServiceImpl.requestTask\n        externalUserId có   → mapping phải tồn tại, else USER_NOT_INITIALIZED\n        externalUserId rỗng → pool \"__PARTNER_POOL__\", lazily provision\n        taskDistributionService.assignAnyAvailableTask(questlabUserId)\n            taskRepository.findNextAvailableTaskIdOutsideGatedCampaigns(userId)  FOR UPDATE\n              JOIN projects (loại task mồ côi)\n              overlap slot còn trống\n              user chưa nhận task này\n              loại campaign có qualification frozen AND required\n            INSERT assigned_tasks (PENDING) + tasks → IN_PROGRESS\n        logAssignment(... SUCCESS | FAILED ...) → integration_transaction_logs\n\n[3] POST /integration/tasks/{assignedTaskId}/submit\n      authClient.verifyPermission(..., INTEGRATION_ANNOTATION_SUBMIT)\n      PartnerAnnotationSyncServiceImpl.submitAnnotation → giống Flow 2\n```\n\n---\n\n## Flow 10 — Media signed URL\n\n```\n[1] App gọi GET /tasks/{taskId}\n      TaskServiceImpl.getTaskById\n        labelStudioClient.getTaskById(lsTaskId)     ← data gốc, URL trỏ vào LS\n        rewriteMediaUrls(contentFromLB, userId)\n            mediaSigningService.sign(path, userId):\n              expires   = now + label-studio.media-url-ttl-minutes (10')\n              signature = HMAC-SHA256(path|userId|expires, media-signing-secret)\n              → \"/media/{path}?expires={ts}&signature={hex}\"\n\n[2] App tải file GET /media/**?expires=..&signature=..   (kèm Authorization)\n      CurrentUserFilter → shouldNotFilter (path bắt đầu \"/media/\") → BỎ QUA\n      MediaController.getMedia\n        authClient.checkAuthorization(request)\n        tokenUserId = authClient.getUserUUIDFromToken(request)\n        extractSignedPath(request)      ← cắt theo indexOf(\"/media/\"), KHÔNG cắt theo độ dài\n      MediaServiceImpl.getMedia\n        mediaSigningService.isValid(path, tokenUserId, expires, signature)\n            hết hạn / sai chữ ký / userId khác → 403 \"Invalid or expired signed URL\"\n        HttpURLConnection tới LS, follow tối đa 5 redirect\n        header \"Authorization: Token \u003cLS token>\" CHỈ khi protocol+host+port == LS\n            → LS 303 sang S3/MinIO thì token KHÔNG bị gửi kèm\n        stream nội dung về client\n```\n"},{"path":"overview/questlab-architecture.d2","type":"d2","group":"overview","title":"Questlab Architecture","content":"# ============================================================================\n#  QUESTLAB — HIGH-LEVEL BACKEND ARCHITECTURE\n#  Render: https://play.d2lang.com/  (paste toàn bộ file này)\n#\n#  Chỉ chứa component CÓ THẬT trong source. Chi tiết từng domain xem\n#  docs/services/*.d2, từng flow xem docs/flows/*.d2\n# ============================================================================\n\ndirection: right\n\ntitle: |md\n  # Questlab — Backend Architecture\n  Spring Boot 3.3.2 · Java 17 · MariaDB · Redis · Label Studio\n| {near: top-center}\n\n# ─────────────────────────── 1. EXTERNAL ACTORS ───────────────────────────\n\nactors: \"External Actors\" {\n  style.fill: \"#f7f7f7\"\n\n  mobile: \"Mobile App\\n(annotator)\" {shape: person}\n  portal: \"admin-portal\\n(Angular)\" {shape: person}\n  partnerBackend: \"Partner backend\\n(SDK, service-to-service)\" {shape: person}\n  lsAdmin: \"Label Studio admin\" {shape: person}\n}\n\ngateway: \"API Gateway\\n· đổi x-api-key -> JWT (qua auth-service)\\n· strip Authorization của client\" {\n  shape: hexagon\n  style.fill: \"#fff0d0\"\n}\n\n# ─────────────────────────── 2. APPLICATION ───────────────────────────────\n\nquestlab: \"questlab-service  ·  port 9090  ·  QuestlabApplication\" {\n  style.fill: \"#f0f7ff\"\n\n  filters: \"Filter chain (không dùng Spring Security)\" {\n    currentUser: \"CurrentUserFilter\\nJWT sub -> CurrentUserContext (ThreadLocal)\\nWHITE_LIST: /media/ /integration/ /swagger-ui /v3/api-docs\"\n    partnerFilter: \"IntegrationPartnerFilter\\n(/integration/**) -> PartnerContext + TransactionContext\"\n  }\n\n  controller: \"Controller Layer  ·  ~171 endpoint\" {\n    tasks: \"TaskController · AssignmentController\\nAnnotationController · TaskRecommendationController\"\n    projects: \"ProjectController · ProjectAssignmentPolicyController\\nCampaignController · RewardController · TemplateController\"\n    qual: \"CampaignQualificationController · QualificationAttemptController\\nQualificationQuestionController · QuestionController · QuestionSetController\"\n    money: \"CompensationController · PayoutAccountController\\nPayoutRequestController · PayoutRequestAdminController\\nPayoutCapabilityAdminController\"\n    imports: \"TaskImportController · TaskImportJobController\\nExternalStorageController · ExternalAssetController\"\n    integ: \"IntegrationController · PartnerAdminController\"\n    misc: \"MediaController · AssignmentConditionDefinitionController\"\n    webhook: \"LsWebhookController\\nPOST /internal/webhooks/label-studio\" {style.fill: \"#e8f4ff\"}\n  }\n\n  service: \"Service Layer  ·  ~55 @Service\" {\n    dist: \"TaskDistributionServiceImpl\\nProjectEligibilityServiceImpl\\nAssignmentPolicyEvaluatorImpl\"\n    ann: \"AnnotationServiceImpl\\nAnnotationValidationOrchestrator\"\n    sync: \"SyncServiceImpl (@Async lsSyncExecutor)\\nProjectTemplateMatcher\"\n    proj: \"ProjectServiceImpl · CampaignServiceImpl\\nProjectDiscoveryServiceImpl\"\n    qualSvc: \"QualificationAttemptServiceImpl · AttemptGrader\\nQualificationPoolServiceImpl · QualificationAssignmentGate\"\n    moneySvc: \"CompensationLedgerWriter · EarningIngressServiceImpl\\nPayoutRequestServiceImpl · PayoutProcessingServiceImpl\\nPayoutStateMachine\"\n    importSvc: \"TaskImportServiceImpl · ImportItemPlanner\\nExternalStorageScanService · ExternalStorageProviderRegistry\"\n    rec: \"TaskRecommendationServiceImpl\\nTaskRecommendationCacheServiceImpl\\nRecommendedTaskAssignmentServiceImpl\"\n    partnerSvc: \"PartnerTaskSyncServiceImpl · PartnerUserSyncServiceImpl\\nPartnerAnnotationSyncServiceImpl\"\n    mediaSvc: \"MediaServiceImpl · MediaSigningServiceImpl (HMAC-SHA256)\"\n  }\n\n  repository: \"Repository Layer  ·  47 Spring Data JPA repository\" {\n    core: \"TaskRepository (FOR UPDATE)\\nAssignedTaskRepository · ProjectRepository\\nTaskAnnotationRepository · SyncJobLogRepository\"\n    other: \"Campaign* · Qualification* · Question*\\nCompensation* · Payout* (PESSIMISTIC_WRITE)\\nTaskImport* · ExternalStorage* · Integration*\"\n  }\n\n  scheduler: \"Scheduler  ·  9 @Scheduled  ·  @EnableScheduling\" {\n    style.fill: \"#eaffea\"\n    s1: \"ReconciliationJob — 0 */3 * * * *\"\n    s2: \"AssignmentExpiryJob — 0 0/10 * * * *\"\n    s3: \"CampaignExpiryJob — 0 0 1 * * *\"\n    s4: \"QualificationAttemptExpiryJob — 0 */5 * * * *\"\n    s5: \"TaskRecommendationRefillJob — 0 */5 * * * *\"\n    s6: \"TaskImportWorkerJob — fixedDelay 10s\"\n    s7: \"ExternalStorageSchedulerTick — 0 * * * * *\"\n    s8: \"SftpImportScannerJob — 0 */5 * * * * (tắt mặc định)\"\n    s9: \"PayoutNotificationDispatchJob — fixedDelay 30s\"\n  }\n\n  integration: \"Integration Layer (RestTemplate + Apache HttpClient5)\" {\n    style.fill: \"#ffe8e8\"\n    lsClient: \"LabelStudioClient\\nLabelStudioImportClient\"\n    authClient: \"AuthClient · AuthProfileClient\\nAuthAdminClient · JwtVerifier\"\n    notifClient: \"NotificationClient\"\n    fileClient: \"FileServiceApiImplClient\"\n    providers: \"S3ExternalStorageProvider (AWS SDK v2)\\nSftpExternalStorageProvider (Mina SSHD)\"\n  }\n\n  errors: \"GlobalExceptionHandler\\n@RestControllerAdvice — luôn trả HTTP 200,\\nmã lỗi thật nằm trong body httpCode/errorCode\"\n}\n\n# ─────────────────────────── 3. INFRASTRUCTURE ────────────────────────────\n\ninfra: \"Infrastructure\" {\n  style.fill: \"#f7f7f7\"\n\n  db: \"MariaDB — questlab_data\\n47 @Entity = 47 bảng\\nddl-auto: none, migration SQL thủ công V2..V37\" {\n    shape: cylinder\n  }\n\n  redis: \"Redis (database 11)\\nCHỈ dùng cho Home recommendation:\\nuser cache · lookup · watchlist (Hash)\" {\n    shape: cylinder\n  }\n\n  configServer: \"Spring Cloud Config Server\\nCONFIG_SERVER_URI (bootstrap.yml)\" {shape: hexagon}\n  eureka: \"Eureka Server\\nregisterWithEureka=false, fetchRegistry=false\" {shape: hexagon}\n  bootAdmin: \"Spring Boot Admin\\n(dpf-admin-server)\" {shape: hexagon}\n}\n\n# ─────────────────────────── 4. EXTERNAL SYSTEMS ──────────────────────────\n\nexternal: \"External Systems\" {\n  style.fill: \"#f5f0ff\"\n\n  ls: \"Label Studio\\n/api/projects · /api/tasks · /api/annotations\\n/api/projects/{id}/import  ·  webhook out\" {\n    shape: hexagon\n  }\n  authService: \"auth-service (ql-auth-service:9091)\\nJWT HS256 · member-profile\\n/internal/users/provision(-session)\" {shape: hexagon}\n  notifService: \"notification-service (ql-notify-service:9094)\\nHTTP in -> Kafka nội bộ -> FCM / Mail\" {shape: hexagon}\n  fileService: \"file-service (ql-file-service:9093)\\nupload / url\" {shape: hexagon}\n  objectStore: \"S3 / MinIO\" {shape: cylinder}\n  sftpServer: \"SFTP server\" {shape: cylinder}\n}\n\n# ─────────────────────────── CONNECTIONS ──────────────────────────────────\n\nactors.mobile -> gateway\nactors.portal -> gateway\nactors.partnerBackend -> gateway: \"x-api-key\"\nactors.lsAdmin -> external.ls\n\ngateway -> questlab.filters: \"Bearer JWT\"\nquestlab.filters -> questlab.controller\n\nexternal.ls -> questlab.controller.webhook: \"webhook PROJECT_* / TASK_*\"\n\nquestlab.controller -> questlab.service\nquestlab.service -> questlab.repository\nquestlab.repository -> infra.db\n\nquestlab.service -> questlab.integration\nquestlab.scheduler -> questlab.service\nquestlab.scheduler -> questlab.repository\n\nquestlab.service.rec -> infra.redis: \"cache + watchlist\"\nquestlab.scheduler.s5 -> infra.redis\n\nquestlab.integration.lsClient -> external.ls\nquestlab.integration.authClient -> external.authService\nquestlab.integration.notifClient -> external.notifService\nquestlab.integration.fileClient -> external.fileService\nquestlab.integration.providers -> external.objectStore\nquestlab.integration.providers -> external.sftpServer\nquestlab.service.mediaSvc -> external.ls: \"proxy /media/** (signed URL)\"\n\nquestlab.service -> questlab.errors: \"exception\"\nquestlab.errors -> questlab.controller: \"BaseMethodResponse\"\n\nquestlab -> infra.configServer: \"bootstrap: nạp config\"\nquestlab -> infra.eureka: \"eureka client\"\nquestlab -> infra.bootAdmin: \"actuator /actuator/**\"\n\n# ─────────────────────────── DEPLOY NOTE ──────────────────────────────────\n\ndeploy: |md\n  ### Deployment\n  `Dockerfile` (openjdk 17, TZ Asia/Ho_Chi_Minh, `java -jar questlab-service.jar`)\n  → GitLab CI: `build → set_version → package → deploy → tag`\n  → push image `registry.3tit.vn/.../questlab-service:{prefix}.{version}`\n  → clone `questlab-core-helm-repo`, sed `values.yaml`, commit\n  → GitOps apply lên Kubernetes\n\n  Version lấy từ `#{version}#` trong **commit message**, không lấy từ `pom.xml`.\n| {near: bottom-center}\n\nnokafka: |md\n  ### Không tồn tại trong questlab-service\n  Kafka / RabbitMQ · Feign · Spring Security · Flyway/Liquibase runtime\n  Redisson / distributed lock · Quartz\n| {near: bottom-left}\n"},{"path":"overview/questlab-backend-overview.md","type":"md","group":"overview","title":"Questlab Backend Overview","content":"# Questlab Backend Overview\n\n> **Tài liệu onboarding cho Backend Developer ~2 năm kinh nghiệm.**\n> Toàn bộ nội dung dưới đây được kiểm chứng bằng cách đọc source, không suy luận từ README.\n> Đường dẫn file được ghi ở mục **Evidence** của từng kết luận quan trọng.\n> Đường dẫn tương đối với `questlab-service/` trừ khi ghi rõ khác.\n>\n> Kiến trúc tổng: [`questlab-architecture.d2`](./questlab-architecture.d2)\n> Chi tiết domain: [`../services/`](../services/) · Chi tiết flow: [`../flows/`](../flows/)\n\n---\n\n## 1. Project Overview\n\n### Questlab giải quyết bài toán gì?\n\nQuestlab là **nền tảng crowdsourcing gán nhãn dữ liệu (data labeling)**.\n\nBài toán thực tế: một công ty AI cần 100 000 bức ảnh được gán nhãn. Họ có\n**Label Studio** — công cụ mã nguồn mở để annotator ngồi vẽ box/chọn nhãn. Nhưng Label Studio\nchỉ phục vụ một đội annotator nội bộ nhỏ; nó **không** biết cách:\n\n- điều phối hàng nghìn người dùng ngoài (crowd) tự nhận việc;\n- đảm bảo mỗi task được N người **khác nhau** làm độc lập (overlap) để đo đồng thuận;\n- chặn người không đủ trình độ, bắt thi sát hạch trước;\n- tính tiền công và trả thưởng;\n- mở API cho đối tác đưa người dùng của họ vào làm.\n\n**Questlab là lớp điều phối đó**, đặt phía trước Label Studio.\n\n### Mô hình khái niệm\n\n```\nCampaign  (chiến dịch, có thời hạn + phần thưởng + bài thi sát hạch)\n   │ N-N\n   ▼\nProject   (1 lô việc — mirror 1 project bên Label Studio)\n   │ 1-N\n   ▼\nTask      (1 đơn vị dữ liệu cần gán nhãn, có overlap = cần N người)\n   │ 1-N\n   ▼\nAssignedTask   (1 lượt giao task cho 1 user, có hạn 3 ngày)\n   │ 1-1\n   ▼\nTaskAnnotation (kết quả gán nhãn — mirror của annotation bên Label Studio)\n   │\n   ▼\nCompensationTransaction (bút toán tiền công)  →  PayoutRequest (yêu cầu rút)\n```\n\n### Workspace gồm 4 repo\n\n| Repo | Vai trò | Ghi chú |\n|---|---|---|\n| **`questlab-service`** | **Backend chính — tài liệu này nói về nó** | 702 file Java, 107 file test |\n| `auth-service` | Xác thực, JWT HS256, user/member profile, permission, api-key partner | Spring Boot cũ hơn, jjwt 0.9.1, Keycloak admin client |\n| `notification-service` | Gửi push (FCM) / mail; nhận HTTP rồi đẩy **Kafka** nội bộ | Kafka nằm ở **đây**, không phải ở questlab |\n| `admin-portal` | Frontend Angular cho admin | |\n\n**Evidence:** `pom.xml` của 4 repo; `notification-service/src/main/java/com/ttt/notification/kafka/NotificationConsumer.java`\n\n---\n\n## 2. Backend Responsibility\n\n`questlab-service` chịu trách nhiệm:\n\n| # | Trách nhiệm | Nơi thực hiện |\n|---|---|---|\n| 1 | **Mirror** project/task/annotation từ Label Studio và giữ đồng bộ 2 chiều | `SyncServiceImpl`, `LsWebhookController`, `ReconciliationJob` |\n| 2 | **Phân phối task** cho annotator, đảm bảo overlap + không trùng người + không race | `TaskDistributionServiceImpl`, `TaskRepository` (FOR UPDATE) |\n| 3 | **Đánh giá điều kiện** (policy theo profile) trước khi giao việc | `ProjectEligibilityServiceImpl`, `AssignmentPolicyEvaluatorImpl` |\n| 4 | **Sát hạch** — bài test đầu vào theo campaign | package `service/qualification/**` |\n| 5 | **Validate annotation** theo `label_config` XML của project | `AnnotationValidationOrchestrator`, package `validation/**` |\n| 6 | **Nhập dữ liệu** từ Portal / SFTP / S3 / MinIO thành task | package `service/taskimport/**` |\n| 7 | **Sổ cái tiền công + quy trình trả thưởng** | package `service/compensation/**`, `service/payout/**` |\n| 8 | **Cổng tích hợp partner** (SDK service-to-service) | package `service/integration/**` |\n| 9 | **Proxy media** của Label Studio bằng signed URL | `MediaServiceImpl`, `MediaSigningServiceImpl` |\n| 10 | **Gợi ý task** cho màn hình Home (Redis cache) | `TaskRecommendationServiceImpl` |\n\n`questlab-service` **KHÔNG** chịu trách nhiệm: phát hành JWT (auth-service), gửi\npush/mail (notification-service), lưu file gốc (file-service / LS storage), giao diện gán nhãn\n(Label Studio).\n\n---\n\n## 3. Technology Stack\n\n| Technology | Version | Purpose | Evidence |\n|---|---|---|---|\n| **Java** | 17 | ngôn ngữ | `pom.xml` `maven.compiler.source` |\n| **Spring Boot** | **3.3.2** | framework | parent `com.ttt.core:base:1.0.0` → `spring-boot-starter-parent:3.3.2` |\n| **Spring Cloud** | 2023.0.3 | Config Server + Eureka client | parent pom |\n| **Maven** | wrapper `mvnw` | build | `pom.xml`, `.mvn/` |\n| **MariaDB** | driver 2.5.4 | database `questlab_data` | `application.yml` `spring.datasource` |\n| **Spring Data JPA / Hibernate** | Boot-managed | ORM, `ddl-auto: none` | `application.yml` |\n| **Redis** | qua `com.ttt.base:cache` | **chỉ** cache Home-recommendation | `CacheServiceConfig`, `TaskRecommendationCacheServiceImpl` |\n| **RestTemplate + Apache HttpClient5** | Boot-managed | mọi outbound HTTP | `config/RestTemplateConfig.java` |\n| **Lombok** | 1.18.30 | boilerplate (`@FieldDefaults`, `@RequiredArgsConstructor`) | `pom.xml` |\n| **MapStruct** | 1.5.5.Final | mapper entity↔DTO | `pom.xml`, package `mapper/` |\n| **ModelMapper** | 2.4.4 | mapper (song song MapStruct) | `pom.xml` |\n| **springdoc-openapi** | 2.5.0 | Swagger UI `/swagger-ui` | `pom.xml`, `config/SwaggerConfig.java` |\n| **AWS SDK v2 (S3)** | 2.28.20 | provider S3 + MinIO (path-style) | `pom.xml`, `S3ExternalStorageProvider` |\n| **Apache Mina SSHD** | 2.13.2 | provider SFTP | `pom.xml`, `SftpExternalStorageProvider` |\n| **com.ttt.core:common / lib** | 0.1.2 | `GetMethodResponse`, `BaseMethodResponse`, exception chung, `EncodeUtils` | `pom.xml` |\n| **Spring Boot Admin client** | 3.3.3 | monitoring | parent pom, `application.yml` |\n| **Logback** | Boot-managed | logging | `logback-spring.xml` |\n\n### KHÔNG có trong questlab-service\n\nĐã grep toàn bộ `src/main/java` và `src/main/resources`:\n\n```\nKafka / RabbitMQ   → 0 hit (chỉ 1 comment nhắc notification-service dùng Kafka)\n@FeignClient       → 0 hit\nSpring Security    → 0 hit (không có SecurityConfig, không có @PreAuthorize)\nFlyway / Liquibase → 0 hit (migration SQL chạy tay)\nRedisson / ShedLock→ 0 hit\nQuartz             → 0 hit (dùng @Scheduled của Spring)\n```\n\n---\n\n## 4. High-Level Architecture\n\n📐 **File D2:** [`questlab-architecture.d2`](./questlab-architecture.d2) — mở trên\n\u003chttps://play.d2lang.com/>.\n\n### Giải thích bằng lời\n\nCó **4 tầng** đọc từ ngoài vào:\n\n**Tầng 1 — External Actors.** Ba loại client: app mobile của annotator, admin-portal (Angular),\nvà backend của partner. Tất cả đi qua **API Gateway**. Gateway làm hai việc quan trọng: đổi\n`x-api-key` của partner thành JWT (bằng cách gọi auth-service), và **strip** header\n`Authorization` mà client tự gửi lên. Điều thứ hai là nền tảng của toàn bộ mô hình bảo mật —\nxem §16.\n\n**Tầng 2 — Application (`questlab-service`).** Một Spring Boot monolith, port 9090. Bên trong\nlà kiến trúc phân lớp cổ điển:\n\n```\nFilter (CurrentUserFilter, IntegrationPartnerFilter)\n   ↓\nController  (~171 endpoint)\n   ↓\nService     (~55 @Service, interface + Impl)\n   ↓\nRepository  (47 Spring Data JPA repository)\n   ↓\nMariaDB\n```\n\nSong song với đường HTTP còn hai đường vào khác:\n- **Scheduler** — 9 job `@Scheduled` gọi thẳng vào tầng Service/Repository.\n- **Webhook** — Label Studio đẩy event vào `LsWebhookController`.\n\nVà một tầng ra: **Integration Layer** — mọi outbound HTTP đi qua đây\n(`LabelStudioClient`, `AuthProfileClient`, `NotificationClient`, `FileServiceApiImplClient`,\ncác `ExternalStorageProvider`).\n\n**Tầng 3 — Infrastructure.** MariaDB là nơi lưu mọi thứ. Redis chỉ phục vụ **một** tính năng\n(Home recommendation) và **có thể chết mà hệ thống vẫn chạy**. Config Server nạp cấu hình lúc\nbootstrap; Eureka và Spring Boot Admin phục vụ vận hành.\n\n**Tầng 4 — External Systems.** Label Studio là hệ thống quan trọng nhất — nó vừa là *nguồn dữ\nliệu* (project, task, annotation) vừa là *đích ghi* (khi user submit annotation). auth-service,\nnotification-service, file-service là các microservice cùng nền tảng. S3/MinIO/SFTP là nguồn dữ\nliệu thô cho module Task Import.\n\n---\n\n## 5. Project Structure\n\n```\nquestlab-service/\n├── pom.xml\n├── Dockerfile\n├── .gitlab-ci.yml\n├── CLAUDE.md                     ← team knowledge base (đọc trước khi code)\n├── conventions/                  ← CODING_CONVENTIONS, PROJECT_ARCHITECTURE, TEAM_GUIDE,\n│                                    SIGNED_URL_DESIGN, TASK_DISTRIBUTION_DESIGN\n├── requirement/                  ← TASK_ASSIGNMENT_REQURIREMENT.MD\n├── docs/                         ← requirement chi tiết từng feature (đọc khi nhận ticket)\n├── tools/graphify/               ← script sinh graph quan hệ code (out/graph.html)\n└── src/main/\n    ├── resources/\n    │   ├── application.yml       ← toàn bộ config nghiệp vụ (cron, ngưỡng, giới hạn)\n    │   ├── bootstrap.yml         ← spring.application.name + CONFIG_SERVER_URI\n    │   ├── logback-spring.xml\n    │   └── db/migration/         ← 37 file SQL, V2..V37 (chạy TAY, không có Flyway)\n    └── java/com/ttt/questlab/\n        ├── QuestlabApplication.java      ← @SpringBootApplication @EnableScheduling\n        │\n        ├── controller/                   ← REST API\n        │   ├── docs/                     ← hằng số mô tả Swagger (tách khỏi controller)\n        │   ├── integration/              ← IntegrationController, PartnerAdminController\n        │   └── taskimport/external/      ← ExternalStorageController, ExternalAssetController\n        ├── webhook/                      ← LsWebhookController\n        │\n        ├── service/                      ← interface ở gốc, Impl ở service/impl\n        │   ├── impl/                     ← 24 Impl \"core\"\n        │   ├── compensation/  payout/    ← tiền\n        │   ├── qualification/            ← sát hạch (+ grading/, model/)\n        │   ├── question/                 ← ngân hàng câu hỏi\n        │   ├── integration/              ← partner SDK\n        │   ├── matching/                 ← MatchingEngine, MatchingScoreServiceImpl\n        │   └── taskimport/               ← module lớn nhất\n        │       ├── parser/  validator/  storage/  registry/  labelconfig/  support/\n        │       ├── directfile/  asset/  sftp/\n        │       └── external/             ← provider/ scan/ schedule/ manifest/ archive/ crypto/ portal/\n        │\n        ├── repository/                   ← 47 JpaRepository (+ projection/)\n        ├── entities/                     ← 47 @Entity\n        ├── dto/                          ← request/response DTO, chia theo domain\n        ├── enums/                        ← trạng thái nghiệp vụ\n        ├── mapper/                       ← MapStruct\n        │\n        ├── assignment/                   ← LOGIC PHÂN PHỐI (tách khỏi service/)\n        │   ├── model/                    ← AssignmentProfileContext, CompiledAssignmentPolicy…\n        │   ├── policy/                   ← Compiler, Validator, Evaluator, Canonicalizer, Hasher\n        │   └── recommendation/           ← cache key + DTO cho Redis\n        │\n        ├── template/                     ← match/ + normalize/ (so khớp label_config với template)\n        ├── validation/                   ← validate annotation theo label_config\n        │   └── config/  layer/  model/  type/\n        │\n        ├── client/                       ← LabelStudioClient, AuthClient, NotificationClient, JwtVerifier\n        ├── config/                       ← properties, filter, async, RestTemplate, JPA audit\n        │   ├── constants/                ← *ErrorCode, PermissionObjectCode, ServicePermissionCode\n        │   ├── integration/              ← IntegrationPartnerFilter, PartnerContext, TransactionContext\n        │   └── taskimport/\n        ├── exception/                    ← GlobalExceptionHandler + exception nghiệp vụ\n        ├── job/                          ← 9 @Scheduled job\n        ├── logging/  util/\n```\n\n### Ba package đáng chú ý vì \"không nằm ở chỗ thường thấy\"\n\n| Package | Vì sao tách riêng |\n|---|---|\n| `assignment/` | Logic phân phối là **thuật toán thuần**, không phụ thuộc Spring. Tách khỏi `service/` để test được như unit test bình thường (`policy/` gồm Compiler → Validator → Canonicalizer → Hasher → Evaluator). |\n| `template/` | So khớp `label_config` XML với template được hỗ trợ. `normalize/` chuẩn hoá XML thành *logic signature*; `match/` tra danh mục. |\n| `validation/` | Validate annotation theo hợp đồng suy ra từ `label_config`. Chia `config/` (resolver + cache), `type/` (từng loại control), `layer/`, `model/`. |\n\n---\n\n## 6. Business Domains\n\n| Domain | Responsibility | Main Controller | Main Service | Main Repository | External Dependency |\n|---|---|---|---|---|---|\n| **Task & Assignment** | Chọn & giao task cho user, đảm bảo overlap/dedup/no-race | `AssignmentController`, `TaskController` | `TaskDistributionServiceImpl`, `TaskServiceImpl` | `TaskRepository`, `AssignedTaskRepository` | auth-service (profile) |\n| **Annotation** | Nhận kết quả gán nhãn, validate, ghi LS + mirror | `AnnotationController` | `AnnotationServiceImpl`, `AnnotationValidationOrchestrator` | `TaskAnnotationRepository` | **Label Studio** |\n| **Label Studio Sync** | Đồng bộ project/task 2 chiều | `LsWebhookController` | `SyncServiceImpl` | `ProjectRepository`, `TaskRepository`, `SyncJobLogRepository` | **Label Studio** |\n| **Project** | Vòng đời project, dashboard, discovery | `ProjectController` | `ProjectServiceImpl`, `ProjectDiscoveryServiceImpl` | `ProjectRepository` | Label Studio |\n| **Assignment Policy** | Điều kiện eligibility theo profile, có version + hash | `ProjectAssignmentPolicyController` | `ProjectAssignmentPolicyServiceImpl`, `AssignmentPolicyEvaluatorImpl` | `ProjectAssignmentPolicyRepository` | – |\n| **Campaign & Reward** | Chiến dịch, gói project + thưởng, vòng đời DRAFT→ACTIVE→CLOSED | `CampaignController`, `RewardController` | `CampaignServiceImpl` | `CampaignRepository`, `CampaignProjectRepository` | notification-service |\n| **Qualification** | Bài thi sát hạch đầu vào của campaign | `CampaignQualificationController`, `QualificationAttemptController` | `QualificationAttemptServiceImpl`, `QualificationPoolServiceImpl`, `QualificationAssignmentGate` | `QualificationAttemptRepository`, `CampaignQualificationConfigRepository` | – |\n| **Question Bank** | Ngân hàng câu hỏi + bộ đề (dùng cho qualification & project SURVEY) | `QuestionController`, `QuestionSetController` | `QuestionServiceImpl`, `QuestionSetServiceImpl` | `QuestionRepository`, `QuestionSetRepository` | – |\n| **Task Import** | Nhập dữ liệu Portal/SFTP/S3/MinIO → tạo task trên LS | `TaskImportController`, `TaskImportJobController`, `ExternalStorageController` | `TaskImportServiceImpl`, `ExternalStorageScanService` | `TaskImportJobRepository`, `ExternalStorage*Repository` | **Label Studio**, file-service, S3/MinIO, SFTP |\n| **Compensation & Payout** | Sổ cái tiền công + quy trình trả thưởng | `CompensationController`, `PayoutRequestController`, `PayoutRequestAdminController` | `CompensationLedgerWriter`, `PayoutProcessingServiceImpl` | `CompensationTransactionRepository`, `PayoutRequestRepository` | notification-service |\n| **Partner Integration** | Cổng SDK service-to-service cho đối tác | `IntegrationController`, `PartnerAdminController` | `PartnerTaskSyncServiceImpl`, `PartnerUserSyncServiceImpl` | `IntegrationPartnerRepository`, `PartnerUserMappingRepository` | auth-service |\n| **Recommendation** | Gợi ý task màn Home, cache Redis | `TaskRecommendationController` | `TaskRecommendationServiceImpl`, `RecommendedTaskAssignmentServiceImpl` | `TaskRepository` | **Redis** |\n| **Media** | Proxy file của LS bằng signed URL | `MediaController`, `ExternalAssetController` | `MediaServiceImpl`, `MediaSigningServiceImpl` | – | **Label Studio**, S3/MinIO |\n\n📄 Chi tiết từng domain: [`../services/`](../services/)\n\n---\n\n## 7. API Architecture\n\n### Quy ước chung của mọi controller\n\n```java\n@RestController\n@RequestMapping(\"/xxx\")\n@RequiredArgsConstructor\n@FieldDefaults(level = AccessLevel.PRIVATE, makeFinal = true)   // Lombok: field tự thành private final\n@Tag(name = \"...\", description = \"...\")                          // Swagger\npublic class XxxController {\n  AuthClient authClient;          // luôn có\n  XxxService xxxService;\n\n  @GetMapping(\"/...\")\n  public ResponseEntity\u003c?> foo(HttpServletRequest servletRequest, ...) throws Exception {\n    authClient.checkAuthorization(servletRequest);                // 1. kiểm token có mặt\n    UUID userId = authClient.getUserUUIDFromToken(servletRequest);// 2. lấy user (nếu cần)\n    return ResponseEntity.ok(GetMethodResponse.builder()          // 3. wrap response\n        .data(...).status(true).httpCode(200).message(\"OK\").build());\n  }\n}\n```\n\nBa điểm cần nhớ:\n1. **Không có `@PreAuthorize`.** Kiểm quyền gọi tay bằng `authClient.checkAuthorization` /\n   `authClient.verifyPermission`.\n2. **Response luôn bọc `GetMethodResponse` / `BaseMethodResponse`** (từ `com.ttt.core:common`).\n3. **HTTP status luôn 200**, mã lỗi thật nằm trong body — xem §17.\n\n### API map (chỉ API có business logic; bỏ CRUD nhỏ)\n\n| Domain | Method | Endpoint | Controller | Service | Purpose |\n|---|---|---|---|---|---|\n| Assignment | POST | `/assignments/request` | `AssignmentController` | `TaskDistributionServiceImpl.requestTask` | **Xin task mới — API quan trọng nhất** |\n| Assignment | GET | `/assignments` | `AssignmentController` | `TaskDistributionServiceImpl.getMyTasks` | Assignment của tôi |\n| Assignment | POST | `/assignments/admin/direct` | `AssignmentController` | `.directAssign` | Admin gán tay |\n| Recommendation | GET | `/assignments/recommendations` | `TaskRecommendationController` | `TaskRecommendationServiceImpl` | Gợi ý \"Dành cho bạn\" (Redis) |\n| Recommendation | POST | `/assignments/recommendations/{id}/assign` | `TaskRecommendationController` | `RecommendedTaskAssignmentServiceImpl.assign` | Nhận task từ gợi ý (revalidate + lock) |\n| Task | GET | `/tasks/{taskId}` | `TaskController` | `TaskServiceImpl.getTaskById` | Nội dung task (gọi LS + ký lại media URL) |\n| Task | GET | `/tasks/my-assigned` | `TaskController` | `.getMyAssignedTasksInProject` | Filter/sort + `statusCounts` |\n| Task | GET | `/tasks/assignable` | `TaskController` | `.getAssignableTasks` | Task còn suất overlap |\n| Annotation | POST | `/annotations?assignedTaskId=` | `AnnotationController` | `AnnotationServiceImpl.createAnnotation` | **Submit kết quả gán nhãn** |\n| Annotation | POST | `/annotations/{annotationId}` | `AnnotationController` | `.updateAnnotation` | Sửa annotation |\n| Webhook | POST | `/internal/webhooks/label-studio` | `LsWebhookController` | `SyncServiceImpl.handle*` | LS bắn event |\n| Project | POST | `/projects` | `ProjectController` | `ProjectServiceImpl` | Tạo project (tạo luôn trên LS) |\n| Project | GET | `/projects/{id}/dashboard` | `ProjectController` | `ProjectServiceImpl` | Thống kê + warning |\n| Project | GET | `/projects/discover` | `ProjectController` | `ProjectDiscoveryServiceImpl` | Khám phá project |\n| Policy | PUT | `/projects/{uuid}/assignment-policy` | `ProjectAssignmentPolicyController` | `ProjectAssignmentPolicyServiceImpl` | Compile + validate + hash policy |\n| Campaign | POST | `/campaigns/{id}/approve` | `CampaignController` | `CampaignServiceImpl.approveCampaign` | DRAFT→ACTIVE + **freeze đề thi** |\n| Campaign | POST | `/campaigns/{id}/activate` | `CampaignController` | `.activateCampaign` | INACTIVE→ACTIVE + freeze lại |\n| Campaign | GET | `/campaigns/public` | `CampaignController` | `.listPublicCampaigns` | `isPublic=true AND status=ACTIVE` |\n| Qualification | POST | `/campaigns/{id}/qualification/attempts` | `CampaignQualificationAttemptController` | `QualificationAttemptServiceImpl.startAttempt` | Bắt đầu thi |\n| Qualification | POST | `/qualification/attempts/{id}/submit` | `QualificationAttemptController` | `.submit` | Nộp bài + chấm (lock chống chấm 2 lần) |\n| Qualification | GET | `/campaigns/{id}/qualification/readiness` | `CampaignQualificationController` | `QualificationReadinessServiceImpl` | Campaign đủ điều kiện approve chưa |\n| Task Import | POST | `/projects/{uuid}/task-imports/preview` | `TaskImportController` | `TaskImportServiceImpl` | Parse + validate, **chưa ghi gì** |\n| Task Import | POST | `/projects/{uuid}/task-imports` | `TaskImportController` | `.createImport` | Tạo job import |\n| Task Import | POST | `/task-import-jobs/{uuid}/retry` | `TaskImportJobController` | `TaskImportJobServiceImpl` | Retry (idempotent) |\n| External Storage | POST | `/external-storage/schedules/{uuid}/run-now` | `ExternalStorageController` | `ExternalStorageRunService` | Chạy lịch quét ngay |\n| Compensation | GET
