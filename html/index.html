Nói ngắn: **LS là kho dữ liệu + trình soạn nhãn; Questlab là hệ điều phối nhân lực.**\n\nApp/mobile **không gọi thẳng LS** — mọi thứ đi qua Questlab. Ngay cả file media của LS cũng\nđược Questlab proxy lại qua `/media/**` với signed URL (xem §7).\n\n```\nMobile App ──► Questlab ──► Label Studio ──► (S3/MinIO/local storage)\n```\n\n---\n\n## 2. Các kênh đồng bộ — có 3 kênh, không phải 1\n\n| # | Kênh | Hướng | Trigger | Class |\n|---|---|---|---|---|\n| 1 | **Webhook** | LS → Questlab | LS bắn event realtime | `LsWebhookController` → `SyncServiceImpl.handle*` |\n| 2 | **Reconciliation** | Questlab kéo từ LS | Cron `0 */3 * * * *` (3 phút) | `ReconciliationJob` → `SyncServiceImpl.reconcile*` |\n| 3 | **Command / write** | Questlab → LS | User thao tác | `LabelStudioClient`, `LabelStudioImportClient` |\n\nKênh 1 là *fast path*, kênh 2 là *safety net* (webhook mất thì 3 phút sau reconcile chữa lại).\n\n---\n\n## 3. Project Sync\n\n### 3.1 Webhook `PROJECT_CREATED` / `PROJECT_UPDATED` / `PROJECT_DELETED`\n\n`POST /internal/webhooks/label-studio` → `LsWebhookController.receive`:\n\n- Parse body thành `LsWebhookPayload`; parse lỗi → `400`.\n- Switch theo `payload.action`, gọi method `@Async(\"lsSyncExecutor\")` của `SyncService`.\n- **Trả `200 OK` ngay lập tức**, không chờ xử lý xong.\n\n```java\ncase \"PROJECT_CREATED\" -> syncService.handleProjectCreated(payload.getProject());\ncase \"PROJECT_UPDATED\" -> syncService.handleProjectUpdated(payload.getProject());\ncase \"PROJECT_DELETED\" -> syncService.handleProjectDeleted(payload.getProject().getId());\ncase \"TASK_CREATED\"    -> syncService.handleTasksCreated(...);\ncase \"TASK_DELETED\"    -> syncService.handleTasksDeleted(...);\ndefault -> log.warn(...)\n```\n\n**Evidence:** `webhook/LsWebhookController.java:44-72`\n\n### 3.2 Template gate — điểm nghiệp vụ quan trọng nhất của project sync\n\nQuestlab **không nhận mọi project của LS**. Mỗi project LS mang một `label_config` XML.\nQuestlab chuẩn hoá XML đó (`TemplateNormalizer`) rồi so khớp với danh mục\n`annotation_templates` mà team đã hỗ trợ (`ProjectTemplateMatcher`).\n\n```\nlabel_config XML\n    ↓ TemplateNormalizer (normalizerVersion)\nlogic signature (hash)\n    ↓ ProjectTemplateMatcher.resolve()\nMatchContext { templateId, matchStatus, logicSignature, normalizerVersion }\n```\n\nKết quả quyết định trạng thái:\n\n| `templateMatchStatus` | `projects.project_status` | `tasks.task_status` khi tạo |\n|---|---|---|\n| `MATCHED` | `ACTIVE` | `AVAILABLE` |\n| `UNMATCHED` / `UNSUPPORTED` | `INACTIVE` | `UNAVAILABLE` |\n\nVì `ProjectEligibilityServiceImpl.findEligibleProjects` chỉ lấy project\n`ACTIVE + MATCHED`, project không khớp template **sẽ không bao giờ được phân phối**.\n\nGate bật/tắt bằng `sync.template-gate.enabled` (default `true`).\n\n**Evidence:** `service/impl/SyncServiceImpl.java:65-95`, `:97-137`, `:139-181`\n\n### 3.3 Reconciliation project — `SyncServiceImpl.reconcileProjects()`\n\n```\nFETCH  : fetchAllProjects()  ← phân trang LS, sleep sync.reconciliation.page-delay-ms giữa các trang\nSAFETY : nếu LS trả về rỗng → ABORT (không xoá gì), ghi SyncJobLog \"empty list from LS — aborted\"\nDIFF   : lsIds vs dbIds  →  toInsert / toUpdate / toDelete\nAPPLY  : insertIfAbsent | updateFromWebhook | markLsDeletedByLsIds\nLOG    : ghi sync_job_log (records processed/inserted/updated/deleted/skipped)\n```\n\n**Safety check là chi tiết đáng học**: nếu LS trả list rỗng (do lỗi mạng, LS restart), code\n**không** coi đó là \"LS đã xoá hết project\" mà dừng lại. Nếu không có guard này, một sự cố\ntạm thời của LS sẽ xoá sạch mirror.\n\n**Evidence:** `service/impl/SyncServiceImpl.java:196-342`\n\n---\n\n## 4. Task Sync\n\n### 4.1 Chiều LS → Questlab\n\n- Webhook `TASK_CREATED` → `handleTasksCreated(lsProjectId, tasks)`:\n  tìm project local; nếu project chưa tồn tại thì **bỏ qua** (log warn). Nếu project\n  `UNMATCHED` thì vẫn insert task nhưng với status `UNAVAILABLE`.\n  Insert bằng `taskRepository.insertIfAbsent` — native `INSERT IGNORE` → **idempotent**,\n  webhook gửi trùng không tạo bản ghi thừa.\n- Webhook `TASK_DELETED` → `handleTasksDeleted`:\n  **`cancelActiveByLsTaskIds` chạy TRƯỚC `markLsDeletedByLsIds`** — huỷ mọi assignment\n  `PENDING` trước khi đánh dấu task đã xoá, để user không submit annotation lên task không\n  còn tồn tại.\n- Reconcile: `reconcileTasksForProject(lsProjectId)` cho từng project ACTIVE.\n\n### 4.2 Safety check tinh vi hơn ở task reconcile\n\nỞ project reconcile, \"rỗng = đáng ngờ\". Ở task reconcile, LS có thể **thật sự** có 0 task.\nCode phân biệt hai trường hợp bằng field `total` mà LS trả về:\n\n```java\nif (lsTaskMap.isEmpty()) {\n  if (fetchResult.reportedTotal() != null && fetchResult.reportedTotal() == 0) {\n    // LS xác nhận total = 0 → tin được → tiếp tục xoá task local\n  } else {\n    // rỗng nhưng không rõ lý do → ABORT\n  }\n}\n```\n\n**Evidence:** `service/impl/SyncServiceImpl.java:364-382`\n\n### 4.3 Chiều Questlab → LS (tạo task mới)\n\nQuestlab đẩy task **lên** LS qua module Task Import (xem `task-import.md`):\n`LabelStudioImportClient.importTasks` / `uploadFile` →\n`POST /api/projects/{lsProjectId}/import`, rồi poll\n`GET /api/projects/{id}/imports/{importId}` nếu LS xử lý bất đồng bộ.\n\n---\n\n## 5. Assignment — LS **không** tham gia\n\nToàn bộ việc \"user nào nhận task nào\" nằm trong Questlab (`assigned_tasks`).\nKhông có API call nào từ `TaskDistributionServiceImpl` sang LS.\n\nĐiều này là **cố ý**: `assignment_settings` của LS được thiết kế cho đội annotator nội bộ,\nkhông đủ cho mô hình crowdsourcing (quota, expiry, policy theo profile, campaign, thù lao).\n\n---\n\n## 6. Annotation\n\nAnnotation đi **cả hai chiều**:\n\n```\nPOST /annotations (user submit)\n   ↓ AnnotationServiceImpl.createAnnotation  @Transactional\n   ├─ validationOrchestrator.validate(request, projectId)     ← check theo label_config\n   ├─ labelStudioClient.createAnnotation(payload, lsTaskId)   ← GHI VÀO LS TRƯỚC\n   │      POST {base}/api/tasks/{lsTaskId}/annotations\n   └─ lưu mirror local:\n        INSERT task_annotations (ls_annotation_id ← id LS trả về, result_json, lead_time)\n        assigned_tasks.status = ANNOTATED\n        tasks.annotation_count += 1\n        nếu đủ overlap → tasks.task_status = COMPLETED\n```\n\n**Thứ tự này quan trọng:** LS là nơi ghi trước và cấp `ls_annotation_id`. Nếu LS lỗi,\nexception bay lên, transaction rollback, không có mirror mồ côi.\n\n`updateAnnotation` gọi `PATCH {base}/api/annotations/{lsAnnotationId}`.\n\n**Evidence:** `service/impl/AnnotationServiceImpl.java:76-131`, `client/LabelStudioClient.java:79-113`\n\n---\n\n## 7. Media — signed URL proxy\n\nTask của LS trỏ tới file (ảnh, audio, HTML…) trên storage của LS. App **không** có token LS,\ngọi thẳng sẽ nhận 401. Giải pháp:\n\n```\nGET /tasks/{taskId}\n   ↓ TaskServiceImpl\n   ├─ labelStudioClient.getTaskById(lsTaskId)     ← lấy data gốc\n   └─ rewriteMediaUrls(contentFromLB, userId)     ← thay URL LS bằng URL nội bộ đã ký\n\n   MediaSigningServiceImpl.sign(path, userId):\n     expires   = now + label-studio.media-url-ttl-minutes (10 phút)\n     signature = HMAC-SHA256(path + \"|\" + userId + \"|\" + expires, media-signing-secret)\n     → \"/media/{path}?expires={ts}&signature={hex}\"\n```\n\nKhi app tải file:\n\n```\nGET /media/**?expires=..&signature=..\n   ↓ MediaController  (path này NẰM TRONG WHITE_LIST của CurrentUserFilter)\n   ├─ authClient.checkAuthorization(request)      ← vẫn cần Authorization header\n   ├─ tokenUserId = authClient.getUserUUIDFromToken(request)\n   ↓ MediaServiceImpl.getMedia\n   ├─ mediaSigningService.isValid(path, tokenUserId, expires, signature) → sai/hết hạn = 403\n   ├─ mở HttpURLConnection tới LS, follow tối đa 5 redirect\n   ├─ CHỈ gửi header \"Authorization: Token \u003cLS token>\" khi host/port/protocol ĐÚNG là LS\n   │    → khi LS redirect 303 sang S3/MinIO, token LS không bị rò ra storage\n   └─ stream nội dung về client\n```\n\nChữ ký gắn với `userId` ⇒ URL của user A dán cho user B dùng sẽ 403.\n\n**Evidence:** `service/impl/MediaSigningServiceImpl.java`, `service/impl/MediaServiceImpl.java:36-140`,\n`config/CurrentUserFilter.java:29-38`, `conventions/SIGNED_URL_DESIGN.md`\n\n---\n\n## 8. Reconciliation — scheduler làm gì\n\n`ReconciliationJob.run()`, cron `sync.reconciliation.cron` = `0 */3 * * * *`:\n\n```\n1. syncService.reconcileProjects()\n     lỗi → log.error + RETURN (bỏ luôn task reconcile: project sai thì task reconcile vô nghĩa)\n2. syncService.reconcileTasksForLsDeletedProjects()\n     lỗi → log.error + tiếp tục\n3. for each lsProjectId in projectRepository.findAllActiveLsIds():\n     syncService.reconcileTasksForProject(lsProjectId)\n     lỗi 1 project → đếm projectsFailed, TIẾP TỤC project còn lại\n4. log tổng kết: projects(i,u,d) tasks(i,u,d) taskProjects(ok,fail)\n```\n\n**Mục đích:** webhook có thể mất (LS down, network, Questlab restart, thread pool\n`lsSyncExecutor` reject). Reconcile là cơ chế *eventual consistency* — chậm nhất 3 phút là\nmirror khớp lại với LS.\n\nMỗi lần chạy ghi một dòng `sync_job_log` (`SyncJobLog.start(...)` → `SUCCESS`/`errorMessage`),\nđây là **nơi đầu tiên cần nhìn khi debug sync**.\n\n**Evidence:** `job/ReconciliationJob.java:24-72`\n\n---\n\n## 9. Source of Truth\n\n| Data | Source of Truth | Ghi chú (từ source) |\n|---|---|---|\n| **Project (metadata, label_config)** | **Label Studio** | Questlab mirror; reconcile so `lsIds` với `dbIds`, LS thắng. **Ngoại lệ:** project do Questlab tạo (`ProjectServiceImpl` gọi `createNewProject`) và project `SURVEY` (`ls_project_id = NULL`, không tồn tại trên LS) |\n| **Task (nội dung `data_json`)** | **Label Studio** | Reconcile update `data_json` từ LS đè lên local |\n| **Task lifecycle (`task_status`, `overlap`, `annotation_count`)** | **Questlab** | LS không có khái niệm này |\n| **Assignment** | **Questlab** | LS hoàn toàn không biết |\n| **Annotation (nội dung)** | **Label Studio** | Ghi vào LS trước, `ls_annotation_id` do LS cấp; `task_annotations` là mirror |\n| **Annotation (ai làm, lúc nào, thuộc assignment nào)** | **Questlab** | `task_annotations.user_id / assigned_task_id / submitted_at` |\n| **Campaign / Qualification / Compensation** | **Questlab** | Không tồn tại ở LS |\n\n---\n\n## 10. Risk\n\n### 10.1 Webhook không xác thực chữ ký\n\n`application.yml` có `label-studio.webhook.secret`, nhưng:\n\n- `LabelStudioProperties` (`@ConfigurationProperties(prefix = \"label-studio\")`) **không có**\n  field `webhook` → property này không bind vào đâu cả.\n- `LsWebhookController` **không** đọc header chữ ký nào; javadoc ghi rõ\n  `[SECURITY REVIEW REQUIRED] — HMAC-SHA256 signature validation via X-LS-Signature header`\n  và `[VERIFY: actual signature header name used by this LS instance]`.\n\n⇒ Ở thời điểm đọc source, **endpoint `/internal/webhooks/label-studio` chưa verify chữ ký**.\nNó nằm ngoài `CurrentUserFilter`? — **Không**: prefix `/internal/` không có trong `WHITE_LIST`\n(`/media/`, `/swagger-ui`, `/v3/api-docs`, `/swagger-resources`, `/integration/`), nên\n`CurrentUserFilter` **vẫn** đòi JWT hợp lệ ở header `Authorization` cho request webhook.\nCách LS được cấu hình để gửi JWT đó — **chưa đủ evidence trong source để kết luận**.\n\n### 10.2 Webhook chạy `@Async` với `CallerRunsPolicy`\n\n`lsSyncExecutor`: core 3, max 20, queue 100, `CallerRunsPolicy`.\nKhi burst quá 20+100, task chạy **trên chính thread HTTP của webhook** → webhook chậm lại\nthay vì mất event. Đánh đổi có chủ ý (không mất event, nhưng LS có thể timeout).\n\n**Evidence:** `config/AsyncConfig.java:19-31`\n\n### 10.3 Không có `@Transactional` ở handler webhook\n\nCác `handle*` không có `@Transactional`; mỗi lệnh repository là một transaction riêng\n(`@Modifying @Transactional` ở tầng repository). Lỗi giữa chừng để lại trạng thái một phần,\nđược reconcile chữa lại sau tối đa 3 phút.\n\n### 10.4 Reconcile là O(số project) call ra LS mỗi 3 phút\n\n`ReconciliationJob` gọi `reconcileTasksForProject` **tuần tự** cho từng project ACTIVE, mỗi\nproject lại phân trang (`page-size: 50`, `page-delay-ms: 200`). Số project lớn → một vòng\nreconcile có thể dài hơn 3 phút. Không thấy cơ chế chống chồng lấn (`@Scheduled` mặc định\nsingle-threaded nên lần chạy sau sẽ bị hoãn, không chạy song song — nhưng nếu deploy nhiều\nreplica thì **mọi replica đều chạy job này**; không thấy distributed lock trong source).\n\n### 10.5 Multi-replica\n\nKhông tìm thấy ShedLock/Redisson/distributed lock cho bất kỳ `@Scheduled` job nào.\nCác job hiện dựa vào tính idempotent của SQL (`INSERT IGNORE`, `UPDATE ... WHERE status = ...`)\nvà, riêng Task Import, dùng **compare-and-set trên cột status** (`jobService.claimStatus`)\nđể không xử lý trùng.\n\n---\n\n## 11. Diagram\n\nXem `label-studio.d2`.\n"},{"path":"services/partner-integration.d2","type":"d2","group":"services","title":"Partner Integration","content":"# Questlab — Partner Integration (SDK service-to-service)\n# Render: https://play.d2lang.com/\n\ndirection: right\n\ntitle: |md\n  # Partner Integration — /integration/**\n| {near: top-center}\n\npartner: \"Partner backend\\n(header: x-api-key)\" {shape: person}\nadmin: \"Questlab Admin\" {shape: person}\n\ngateway: \"API Gateway\\n- đổi x-api-key -> JWT (qua auth-service)\\n- STRIP Authorization client gửi lên\" {\n  shape: hexagon\n  style.fill: \"#fff0d0\"\n}\n\nauthService: \"auth-service\\n/internal/users/provision\\n/internal/users/provision-session\" {shape: hexagon}\n\nquestlab: \"questlab-service\" {\n\n  filters: \"Filter chain\" {\n    currentUser: \"CurrentUserFilter\\nWHITE_LIST chứa /integration/ => BỎ QUA\\n(sub là owner user, không phải acting user)\"\n    partnerFilter: \"IntegrationPartnerFilter\\nAI đang gọi?\" {\n      style.fill: \"#ffe8e8\"\n    }\n    jwtVerifier: \"JwtVerifier\\nHMAC-SHA256, alg allowlist HS256\\nfail closed nếu thiếu auth.secret-key\"\n  }\n\n  ctrl: \"IntegrationController\\nĐƯỢC PHÉP gì? verifyPermission()\"\n  adminCtrl: \"PartnerAdminController\\n/admin/integration/**\"\n\n  svc: \"Business Layer\" {\n    userSync: \"PartnerUserSyncServiceImpl\\ninitUser\"\n    taskSync: \"PartnerTaskSyncServiceImpl\\nrequestTask\"\n    annSync: \"PartnerAnnotationSyncServiceImpl\\nsubmitAnnotation\"\n    partnerSvc: PartnerServiceImpl\n    logSvc: IntegrationTransactionLogServiceImpl\n    labelingEvt: \"PartnerLabelingEventServiceImpl\\n(no-op với user thường)\"\n  }\n\n  dist: \"TaskDistributionServiceImpl\\nassignAnyAvailableTask()\"\n  ctx: \"PartnerContext + TransactionContext\\n(ThreadLocal, clear trong finally)\"\n}\n\nrepo: \"Repository\" {\n  partnerRepo: IntegrationPartnerRepository\n  mappingRepo: \"PartnerUserMappingRepository\\nexternalUserId \u003c-> questlabUserId\"\n  logRepo: IntegrationTransactionLogRepository\n  taskRepo: \"TaskRepository\\nfindNextAvailableTaskIdOutsideGatedCampaigns\\n(FOR UPDATE)\"\n}\n\ndb: \"MariaDB\\nintegration_partners / partner_user_mappings\\nintegration_transaction_logs / tasks / assigned_tasks\" {\n  shape: cylinder\n}\n\npartner -> gateway: \"x-api-key + transactionId\"\ngateway -> questlab.filters.partnerFilter: \"Bearer JWT\"\nquestlab.filters.partnerFilter -> questlab.filters.jwtVerifier: \"verify chữ ký\"\nquestlab.filters.partnerFilter -> repo.partnerRepo: \"JWT.sub -> auth_client.owner_id\\n-> integration_partners.auth_client_id\"\nquestlab.filters.partnerFilter -> questlab.ctx: \"set(partnerId, partnerCode, transactionId)\"\nquestlab.filters.partnerFilter -> questlab.ctrl\n\nquestlab.ctrl -> questlab.svc.userSync: \"POST /integration/users/init\"\nquestlab.ctrl -> questlab.svc.taskSync: \"POST /integration/tasks/request\"\nquestlab.ctrl -> questlab.svc.annSync: \"POST /integration/tasks/{id}/submit\"\n\nquestlab.svc.userSync -> authService: \"provisionUser rồi provisionUserWithSession\\n(2 BƯỚC — 1 bước sẽ mất profile)\"\nquestlab.svc.userSync -> repo.mappingRepo\n\nquestlab.svc.taskSync -> repo.mappingRepo: \"externalUserId? định danh : pool __PARTNER_POOL__\"\nquestlab.svc.taskSync -> questlab.dist\nquestlab.dist -> repo.taskRepo\nquestlab.svc.taskSync -> questlab.svc.logSvc\nquestlab.svc.annSync -> questlab.svc.logSvc\nquestlab.svc.logSvc -> repo.logRepo\n\nquestlab.svc.labelingEvt -> repo.logRepo\n\nadmin -> questlab.adminCtrl -> questlab.svc.partnerSvc -> repo.partnerRepo\n\nrepo -> db\n"},{"path":"services/partner-integration.md","type":"md","group":"services","title":"Domain: Partner Integration (SDK service-to-service)","content":"# Domain: Partner Integration (SDK service-to-service)\n\n---\n\n## 1. Purpose\n\nCho phép **backend của đối tác** (partner) gọi vào Questlab để user của họ làm task gán nhãn,\nmà không cần user đó có tài khoản Questlab thật.\n\nBề mặt này **không dành cho frontend/mobile gọi trực tiếp** — javadoc `IntegrationController`\nghi rõ: *\"NOT meant to be called by any frontend/mobile client directly.\"*\n\n---\n\n## 2. Entry points\n\n### `/integration/**` — partner gọi (S2S)\n\n| Method | Endpoint | Service | Permission code |\n|---|---|---|---|\n| POST | `/integration/users/init` | `PartnerUserSyncService.initUser` | `INTEGRATION_USER_INIT` |\n| POST | `/integration/tasks/request` | `PartnerTaskSyncService.requestTask` | `INTEGRATION_TASK_REQUEST` |\n| POST | `/integration/tasks/{assignedTaskId}/submit` | `PartnerAnnotationSyncService.submitAnnotation` | `INTEGRATION_ANNOTATION_SUBMIT` |\n\nHeader bắt buộc: `Authorization` (JWT), `transactionId`. Tuỳ chọn: `X-Partner-Code`.\n\n### `/admin/integration/**` — quản trị partner\n\n| Method | Endpoint |\n|---|---|\n| POST/GET | `/admin/integration/partners` |\n| PUT | `/admin/integration/partners/{partnerCode}/auth-client` |\n| POST | `/admin/integration/partners/{partnerCode}/api-keys` |\n| GET | `/admin/integration/transactions` — tra cứu log đối soát |\n\n---\n\n## 3. Xác thực — mô hình 2 lớp\n\n```\nPartner backend\n   │  header: x-api-key\n   ▼\nAPI Gateway ──────► auth-service : đổi x-api-key thành JWT\n   │  header: Authorization: Bearer \u003cJWT>   (gateway STRIP header client gửi lên)\n   ▼\nquestlab-service\n   ├── IntegrationPartnerFilter   : AI đang gọi?      → PartnerContext (ThreadLocal)\n   └── IntegrationController      : ĐƯỢC PHÉP gì?     → authClient.verifyPermission(...)\n```\n\nChuỗi suy ra partner:\n\n```\nJWT.sub  (= base_user.uuid của owner user)\n   → auth_client.owner_id → auth_client.id\n   → integration_partners.auth_client_id\n```\n\n**Phân vai có chủ ý** (javadoc `IntegrationPartnerFilter`):\nfilter trả lời *ai đang gọi*, controller trả lời *được phép gọi gì*. Tách vậy vì\n`ForbiddenException` ném từ controller mới đi qua được `GlobalExceptionHandler`; ở filter thì\nphải tự serialize response.\n\n### `transactionId` bắt buộc\n\nFilter **từ chối 400** nếu thiếu header `transactionId`:\n\n> *\"Bắt buộc với `/integration/**`: đây là khoá đối soát công nợ với partner. Thiếu mà vẫn cho\n> qua thì log ghi `transaction_id = NULL` — hỏng âm thầm đúng cho quan trọng nhất, không ai\n> phát hiện cho đến lúc đối số.\"*\n\nNó nằm ở **header chứ không phải body** vì luồng App dùng cả endpoint GET (không có body).\n\n### `X-Partner-Code` — cross-check\n\nNếu client gửi header này mà không khớp partner suy ra từ token → `403 PARTNER_CODE_MISMATCH`.\nMục đích: bắt sớm lỗi cấu hình nhầm key của partner khác.\n\n### `ThreadLocal` phải clear\n\n```java\nfinally {\n  PartnerContext.clear();\n  TransactionContext.clear();\n}\n```\n> *\"Bắt buộc: `PartnerContext` là ThreadLocal trên thread pool của servlet container. Không\n> clear = request của partner sau đọc được context của partner trước.\"*\n\n### Trust boundary\n\n`resolvePartner` **không kiểm chữ ký JWT** — `AuthClient.extractSub` chỉ Base64-decode payload.\nJavadoc thừa nhận thẳng và giải thích: đây là mô hình chung của platform, ranh giới tin cậy là\n**gateway**. Hai điều kiện để mô hình này đứng vững (ghi ở\n`docs/integration/ADR-001-gateway-trust-boundary.md`):\n\n1. NetworkPolicy chỉ cho gateway tới pod questlab-service;\n2. gateway **strip** `Authorization` do client gửi lên.\n\n`JwtVerifier` (HMAC-SHA256, `auth.secret-key`) bổ sung lớp kiểm chữ ký **riêng cho\n`/integration/**`**, vì bề mặt này trước đây có phép kiểm mật mã riêng\n(`partner_api_keys`, đã bị xoá ở migration `V26__drop_partner_api_keys.sql`).\n\nGiới hạn của `JwtVerifier` được ghi rõ trong javadoc:\n- **Không check `iss`** — auth-service truyền `user.getName()` làm issuer (tên hiển thị), check\n  vô nghĩa và gãy khi user đổi tên.\n- **`exp` là tuỳ chọn** — JWT mint từ api-key dùng `ttl = -1` nên không có `exp`. Chỉ reject\n  khi `exp` **có mặt** mà đã quá hạn.\n- **HS256 đối xứng** — verify được nghĩa là service này cũng ký được; là bước lùi so với\n  RS256/JWKS nhưng vẫn tốt hơn hiện trạng.\n- Allowlist thuật toán chỉ 1 giá trị `HS256` → chặn `alg: none` và alg-confusion.\n- So sánh chữ ký bằng `MessageDigest.isEqual` (constant-time, tránh timing oracle).\n- **Fail closed**: thiếu `auth.secret-key` → từ chối mọi request `/integration/**`.\n\n**Evidence:** `config/integration/IntegrationPartnerFilter.java`, `client/JwtVerifier.java`\n\n---\n\n## 4. Persistence\n\n| Entity | Table | Ý nghĩa |\n|---|---|---|\n| `IntegrationPartner` | `integration_partners` | partner_code, auth_client_id, status |\n| `PartnerUserMapping` | `partner_user_mappings` | `externalUserId` (bên partner) ↔ `questlabUserId` |\n| `IntegrationTransactionLog` | `integration_transaction_logs` | log đối soát: partner, event, transaction_id, status |\n\n`IntegrationEventType`: `USER_INIT | USER_CREATED | TASK_ASSIGNED | TASK_SUBMITTED |\nTASK_COMPLETED | TASK_FAILED`\n`PartnerUserSourceType`: `THIRD_PARTY_APP | PARTNER_APP | SDK_INTEGRATION`\n\n---\n\n## 5. Important flows\n\n### 5.1 Hai chế độ user\n\n```java\nif (StringUtils.hasText(request.getExternalUserId())) {\n    // ĐỊNH DANH — user phải đã gọi /integration/users/init trước\n    return partnerUserMappingRepository.findByPartnerIdAndExternalUserId(...)\n        .orElseThrow(() -> new ResourceNotFoundException(..., USER_NOT_INITIALIZED));\n}\n// VÃNG LAI — dùng chung pool user \"__PARTNER_POOL__\", lazily provision lần đầu\nreturn partnerUserMappingRepository\n    .findByPartnerIdAndExternalUserId(partner.getId(), POOL_EXTERNAL_USER_ID)\n    .orElseGet(() -> createPoolUserMapping(partner, request));\n```\n\nUser pool được tạo thật bên auth-service qua `AuthProfileClient.provisionUser`:\n`username = \"ql_pool_\" + partnerCode`, `email = \"ql_pool_{code}@partner.questlab.internal\"`.\n\n> ⚠️ Init user phải đi **2 bước**. Javadoc `AuthProfileClient.provisionUser` giải thích:\n> DTO của `provision-session` chỉ có `uuid/username/email/first_name/last_name/roles`;\n> auth-service **không** bật `FAIL_ON_UNKNOWN_PROPERTIES` nên 10 field profile gửi kèm bị\n> Jackson bỏ **im lặng** — user tạo ra không có dòng profile nào, và vì\n> `findMemberProfileByUserId` là INNER JOIN nên mọi lần xin task nhận `503\n> AUTH_PROFILE_UNAVAILABLE`. Cách đúng: gọi `provisionUser` (tạo user + profile) rồi\n> `provisionUserWithSession` (lấy phiên).\n\n### 5.2 Pool task riêng cho partner\n\nPartner **không** đi qua `findNextAssignableTaskId` mà dùng\n`TaskDistributionServiceImpl.assignAnyAvailableTask` →\n`taskRepository.findNextAvailableTaskIdOutsideGatedCampaigns(userId)`.\n\nQuery này **bỏ qua** project/eligibility policy, nhưng **KHÔNG bỏ qua** 4 ràng buộc:\n\n| Ràng buộc | Vì sao (theo javadoc) |\n|---|---|\n| `JOIN projects` (project còn sống) | `tasks.project_id` không có FK → task mồ côi. Vì `ORDER BY t.id ASC` luôn chọn id nhỏ nhất, nó sẽ vấp đúng dòng hỏng ở **MỌI** lần gọi, **làm chết hẳn luồng partner** cho tới khi ai đó sửa dữ liệu |\n| overlap slot còn trống | `task_status` chỉ chuyển `COMPLETED` khi annotation thực sự đủ — khoảng giữa hai mốc là chỗ cấp thừa |\n| user chưa nhận task này (`:userId`) | Chế độ vãng lai dùng chung pool user ⇒ người sau mở task ra **thấy nhãn của người trước**. Nặng hơn: `overlap` tồn tại để N người **độc lập** chấm, cùng một danh tính chấm lại thì số liệu đồng thuận là giả |\n| loại campaign có qualification `frozen AND required` | SDK partner là kênh tự động, **không có UX để làm bài test** |\n\nLưu ý: điều kiện loại campaign **cố ý không phụ thuộc user** — task của campaign phải đi qua\nluồng campaign chứ không qua pool chung.\n\n**Evidence:** `repository/TaskRepository.java` (javadoc\n`findNextAvailableTaskIdOutsideGatedCampaigns`), `service/impl/TaskDistributionServiceImpl.java:227-271`\n\n### 5.3 Ghi log đối soát ở cả 2 nhánh\n\n```java\ntry {\n    assignment = taskDistributionService.assignAnyAvailableTask(mapping.getQuestlabUserId());\n} catch (ValidationException e) {\n    // hết task là kết quả nghiệp vụ thật, không phải bug (AC2)\n    logAssignment(..., IntegrationLogStatus.FAILED, e.getMessage());\n    throw e;\n}\nlogAssignment(..., IntegrationLogStatus.SUCCESS, null);\n```\n\n### 5.4 `PartnerLabelingEventService` — no-op cho user thường\n\n`AnnotationServiceImpl` gọi `partnerLabelingEventService.recordTaskSubmitted(...)` /\n`recordTaskFailed(...)` ở mọi lần submit. Với user thường (không phải user của partner) đây là\n**no-op** (comment \"AC2\"). Nhờ vậy luồng annotation dùng chung một code path cho cả hai loại\nuser.\n\n---\n\n## 6. Risk\n\n| Rủi ro | Trạng thái |\n|---|---|\n| `ThreadLocal` rò rỉ giữa request | Đã clear trong `finally` |\n| JWT giả mạo | `JwtVerifier` HMAC-SHA256 + trust boundary ở gateway (phụ thuộc NetworkPolicy + gateway strip header — **hạ tầng, không kiểm được trong source**) |\n| Thiếu `transactionId` | Reject 400 |\n| Nhầm partner | `X-Partner-Code` cross-check → 403 |\n| Cùng người chấm lại task mình đã làm | Đã fix bằng `:userId` trong query pool |\n| Task mồ côi làm chết luồng | Đã fix bằng `JOIN projects` |\n| JWT sống vĩnh viễn (`ttl = -1`) | Bù bằng revoke api-key xoá cache Redis bên auth-service |\n\n---\n\n## 7. Diagram\n\nXem `partner-integration.d2`.\n"},{"path":"services/project-campaign.d2","type":"d2","group":"services","title":"Project Campaign","content":"# Questlab — Project / Campaign / Reward\n# Render: https://play.d2lang.com/\n\ndirection: right\n\ntitle: |md\n  # Project & Campaign domain\n| {near: top-center}\n\nadmin: \"Admin Portal (Angular)\" {shape: person}\nuser: \"Mobile App user\" {shape: person}\n\napi: \"API Layer\" {\n  projectCtrl: \"ProjectController\\n/projects\"\n  policyCtrl: \"ProjectAssignmentPolicyController\\n/projects/{uuid}/assignment-policy\"\n  campaignCtrl: \"CampaignController\\n/campaigns\"\n  rewardCtrl: \"RewardController\\n/rewards\"\n}\n\nservice: \"Business Layer\" {\n  projectSvc: \"ProjectServiceImpl\"\n  discoverySvc: \"ProjectDiscoveryServiceImpl\"\n  policySvc: \"ProjectAssignmentPolicyServiceImpl\"\n  campaignSvc: \"CampaignServiceImpl\"\n  poolSvc: \"QualificationPoolServiceImpl\\nfreezeForGoLive()\"\n  notifySvc: \"CampaignNotificationServiceImpl\"\n  matcher: \"ProjectTemplateMatcher\"\n  rewardSvc: \"RewardServiceImpl\"\n}\n\nrepo: \"Repository Layer\" {\n  projectRepo: ProjectRepository\n  policyRepo: ProjectAssignmentPolicyRepository\n  campaignRepo: CampaignRepository\n  campaignProjectRepo: CampaignProjectRepository\n  campaignRewardRepo: CampaignRewardRepository\n  rewardRepo: RewardRepository\n  templateRepo: AnnotationTemplateRepository\n}\n\ndb: \"MariaDB\" {\n  shape: cylinder\n  t1: \"projects\"\n  t2: \"project_assignment_policies\"\n  t3: \"campaigns\"\n  t4: \"campaign_projects\"\n  t5: \"campaign_rewards\"\n  t6: \"rewards\"\n  t7: \"annotation_templates\"\n}\n\nls: \"Label Studio\" {shape: hexagon}\nnotif: \"notification-service\" {shape: hexagon}\n\njob: \"CampaignExpiryJob\\ncron: 0 0 1 * * * (1h sáng)\"\n\nadmin -> api.projectCtrl\nadmin -> api.policyCtrl\nadmin -> api.campaignCtrl\nuser -> api.campaignCtrl: \"GET /campaigns/public\"\nuser -> api.projectCtrl: \"GET /projects/discover\"\n\napi.projectCtrl -> service.projectSvc\napi.projectCtrl -> service.discoverySvc\napi.policyCtrl -> service.policySvc\napi.campaignCtrl -> service.campaignSvc\napi.rewardCtrl -> service.rewardSvc\n\nservice.projectSvc -> ls: \"createNewProject / updateProject\\n(chỉ ProjectType = LABELING)\"\nservice.projectSvc -> service.matcher: \"resolve(label_config)\"\nservice.matcher -> repo.templateRepo\n\nservice.campaignSvc -> service.poolSvc: \"approve / activate\\n=> freezeForGoLive\"\nservice.campaignSvc -> service.notifySvc\nservice.notifySvc -> notif: \"NotificationClient (HTTP)\"\n\nservice.projectSvc -> repo.projectRepo\nservice.policySvc -> repo.policyRepo\nservice.campaignSvc -> repo.campaignRepo\nservice.campaignSvc -> repo.campaignProjectRepo\nservice.campaignSvc -> repo.campaignRewardRepo\nservice.rewardSvc -> repo.rewardRepo\n\nrepo.projectRepo -> db.t1\nrepo.policyRepo -> db.t2\nrepo.campaignRepo -> db.t3\nrepo.campaignProjectRepo -> db.t4\nrepo.campaignRewardRepo -> db.t5\nrepo.rewardRepo -> db.t6\nrepo.templateRepo -> db.t7\n\njob -> repo.campaignRepo: \"closeExpiredCampaigns(today)\"\n\nlifecycle: |md\n  ### Campaign status\n  `DRAFT` --approve--\u003e `ACTIVE`\n  `ACTIVE` --deactivate--\u003e `INACTIVE`\n  `INACTIVE` --activate--\u003e `ACTIVE`\n  `ACTIVE` --CampaignExpiryJob--\u003e `CLOSED`\n\n  `is_public` độc lập với `status`\n| {near: bottom-center}\n"},{"path":"services/project-campaign.md","type":"md","group":"services","title":"Domain: Project, Campaign & Reward","content":"# Domain: Project, Campaign & Reward\n\n---\n\n## 1. Purpose\n\n- **Project** = một \"lô việc gán nhãn\" — tương ứng 1 project bên Label Studio (trừ project\n  `SURVEY`). Chứa `label_config`, `overlap`, `end_date`, `price`.\n- **Campaign** = một **chiến dịch** gói nhiều project lại, gắn phần thưởng, có thời hạn,\n  có thể yêu cầu bài test đầu vào (qualification), và có thể công khai cho user chọn tham gia.\n- **Reward** = phần thưởng gắn vào campaign.\n\nQuan hệ: `Campaign ──(N:N qua campaign_projects)── Project`,\n`Campaign ──(N:N qua campaign_rewards)── Reward`.\n\n---\n\n## 2. Entry points\n\n### Project — `ProjectController` (`/projects`)\n\n| Method | Endpoint | Mục đích |\n|---|---|---|\n| POST | `/projects` | Tạo project (tạo luôn trên LS, hoặc SURVEY thì chỉ local) |\n| GET | `/projects` , `/projects/filter` | Danh sách |\n| GET | `/projects/{projectId}` | Chi tiết |\n| PUT | `/projects/{projectId}` | Sửa (đẩy sang LS) |\n| PUT | `/projects/{projectId}/overlap` | Đổi overlap |\n| PUT | `/projects/{id}/activate` \\| `/deactivate` \\| `/archived` | Đổi vòng đời |\n| DELETE | `/projects/{projectId}` | Xoá mềm |\n| GET | `/projects/{projectId}/dashboard` | Số liệu thống kê project |\n| GET | `/projects/discover` | Khám phá project cho user |\n| GET | `/projects/contributed` | Project tôi đã tham gia |\n| GET/PUT/DELETE | `/projects/{projectUuid}/assignment-policy` | CRUD policy eligibility |\n\n### Campaign — `CampaignController` (`/campaigns`)\n\n| Method | Endpoint | Mục đích |\n|---|---|---|\n| POST | `/campaigns` | Tạo (status `DRAFT`) |\n| GET | `/campaigns` , `/campaigns/public` | Danh sách (admin / công khai) |\n| PUT | `/campaigns/{id}` | Sửa |\n| POST | `/campaigns/{id}/approve` | `DRAFT → ACTIVE` + **freeze qualification pool** |\n| POST | `/campaigns/{id}/deactivate` | `ACTIVE → INACTIVE` |\n| POST | `/campaigns/{id}/activate` | `INACTIVE → ACTIVE` + **freeze lại** |\n| PUT | `/campaigns/{id}/publish` \\| `/unpublish` | Bật/tắt hiển thị ở `/campaigns/public` |\n| DELETE | `/campaigns/{id}` | Xoá |\n| POST/DELETE | `/campaigns/{id}/projects/{projectId}` | Link/unlink project |\n| POST/DELETE | `/campaigns/{id}/rewards/{rewardId}` | Link/unlink reward |\n\n**Evidence:** `controller/ProjectController.java`, `controller/CampaignController.java`\n\n---\n\n## 3. Business logic\n\n```\nProjectController → ProjectService → ProjectServiceImpl (908 dòng — service lớn nhất)\n    ├── ProjectRepository\n    ├── LabelStudioClient        (createNewProject / updateProject / getProjectById)\n    ├── TaskRepository           (bulkUpdateStatusByProjectId, bulkMarkDeletedByProjectId)\n    ├── AssignedTaskRepository\n    └── ProjectTemplateMatcher\n\nCampaignController → CampaignService → CampaignServiceImpl\n    ├── CampaignRepository / CampaignProjectRepository / CampaignRewardRepository\n    ├── QualificationPoolService     (freezeForGoLive)\n    └── CampaignNotificationService  → NotificationClient → notification-service\n```\n\n---\n\n## 4. Persistence\n\n| Entity | Table | Ghi chú |\n|---|---|---|\n| `Project` | `projects` | `ls_project_id` **unique, NULL với SURVEY**; `template_match_status`; `project_status`; `overlap`; `max_overlap_ratio`; `question_set_id` (bắt buộc với SURVEY) |\n| `Campaign` | `campaigns` | `status` ∈ DRAFT/ACTIVE/INACTIVE/COMPLETED/CLOSED; `is_public` **độc lập với status**; `start_date`/`end_date` |\n| `CampaignProject` | `campaign_projects` | bảng nối |\n| `CampaignReward` | `campaign_rewards` | bảng nối |\n| `Reward` | `rewards` | |\n| `AnnotationTemplate` | `annotation_templates` | danh mục template được hỗ trợ |\n\n### Hai loại project — `ProjectType`\n\n| | `LABELING` | `SURVEY` |\n|---|---|---|\n| Tồn tại trên LS | ✅ | ❌ (`ls_project_id = NULL`) |\n| Nguồn nội dung | `label_config` XML | `question_set_id` → `question_sets` |\n| Lưu ý code | mọi code path đi ra LS **phải null-check `lsProjectId`** | |\n\n> Javadoc của `Project.lsProjectId` ghi rõ: *\"NULL với project SURVEY — loại này không được tạo\n> trên LS (quyết định D1 của RS2-10034), nên mọi code path đi ra LS phải kiểm tra null trước khi\n> dùng.\"*\n\n---\n\n## 5. Integration\n\n| Hệ thống | Khi nào |\n|---|---|\n| **Label Studio** | Tạo/sửa project `LABELING`; đọc metadata |\n| **notification-service** | `CampaignNotificationServiceImpl` → `NotificationClient` gửi push/mail khi campaign được approve |\n\n---\n\n## 6. Background processing\n\n| Job | Cron | Làm gì |\n|---|---|---|\n| `CampaignExpiryJob` | `campaign.expiry.cron` = `0 0 1 * * *` (1h sáng hằng ngày) | `campaignRepository.closeExpiredCampaigns(LocalDate.now())` — đóng campaign quá `end_date` |\n\n**Evidence:** `job/CampaignExpiryJob.java`\n\n---\n\n## 7. Important flows\n\n### 7.1 Campaign lifecycle\n\n```\n     createCampaign\n          ↓\n       DRAFT ──approve──► ACTIVE ──deactivate──► INACTIVE\n                            │                        │\n                            │                        └──activate──► ACTIVE\n                            │\n                    CampaignExpiryJob (quá end_date)\n                            ↓\n                         CLOSED\n```\n\nGuard trạng thái rất chặt trong `CampaignServiceImpl`:\n\n- `approveCampaign` — chỉ chạy khi `status == DRAFT`, ngược lại\n  `BadRequestException(CampaignErrorCode.NOT_DRAFT)`.\n- `deactivateCampaign` — chỉ khi `ACTIVE` (`NOT_ACTIVE`).\n- `activateCampaign` — chỉ khi `INACTIVE` (`NOT_INACTIVE`).\n\n**Điểm nghiệp vụ quan trọng:** cả `approve` và `activate` đều gọi\n`qualificationPoolService.freezeForGoLive(campaign)`. Freeze = chốt lại bộ đề thi tại thời\nđiểm campaign lên sóng. Comment trong source giải thích vì sao `activate` cũng phải freeze:\nbộ câu hỏi có thể đã bị đổi trong lúc campaign nằm `INACTIVE`.\n\n**Evidence:** `service/impl/CampaignServiceImpl.java:182-233`\n\n### 7.2 `is_public` tách rời `status`\n\nJavadoc `Campaign.isPublic`: *\"Independent of status — gates visibility on\n`GET /campaigns/public` only.\"*\n`GET /campaigns/public` lọc `isPublic = true AND status = ACTIVE`. Nghĩa là admin có thể\napprove campaign (chạy thật) mà chưa cho hiển thị công khai, và ngược lại.\n\n### 7.3 Project → có được phân phối task không?\n\nChỉ khi **cả 3** đúng:\n\n```\nprojects.project_status      = ACTIVE\nprojects.template_match_status = MATCHED\nprojects.end_date            >= now          ← findActiveAssignableProjects(status, matchStatus, now)\n```\n\nCộng thêm `ProjectAssignmentPolicy` (nếu có bản `enabled`) và qualification gate.\n\n---\n\n## 8. Risk\n\n- **`tasks.project_id` không có FK.** Javadoc của\n  `TaskRepository.findNextAvailableTaskIdOutsideGatedCampaigns` nói rõ: project bị xoá cứng\n  để lại task mồ côi, và vì `ORDER BY t.id ASC` luôn chọn id nhỏ nhất, luồng partner sẽ vấp\n  đúng dòng hỏng ở **mọi** lần gọi. Đó là lý do query đó phải `JOIN projects`.\n- **`ls_project_id` unique** — nếu LS tái sử dụng id (không xảy ra trong thực tế) sẽ va chạm.\n- **Xoá project là xoá mềm** (`is_deleted`, `ls_deleted`); mọi query nghiệp vụ đều phải kèm\n  `is_deleted = false AND ls_deleted = false`. Quên điều kiện này là lớp bug phổ biến nhất\n  của codebase.\n\n---\n\n## 9. Diagram\n\nXem `project-campaign.d2`.\n"},{"path":"services/qualification.d2","type":"d2","group":"services","title":"Qualification","content":"# Questlab — Qualification & Question Bank\n# Render: https://play.d2lang.com/\n\ndirection: right\n\ntitle: |md\n  # Qualification & Question Bank (RS2-10027)\n| {near: top-center}\n\nadmin: \"Admin / Reviewer\" {shape: person}\ncandidate: \"Annotator (candidate)\" {shape: person}\n\napi: \"API Layer\" {\n  questionCtrl: \"QuestionController\\n/questions\"\n  setCtrl: \"QuestionSetController\\n/question-sets\"\n  qualCtrl: \"CampaignQualificationController\\n/campaigns/{id}/qualification\"\n  qQuestionCtrl: \"QualificationQuestionController\\n/qualification/questions\"\n  attemptStartCtrl: \"CampaignQualificationAttemptController\\nPOST .../attempts\"\n  attemptCtrl: \"QualificationAttemptController\\n/qualification/attempts/{id}\"\n}\n\nsvc: \"Business Layer\" {\n  questionSvc: QuestionServiceImpl\n  setSvc: QuestionSetServiceImpl\n  configSvc: CampaignQualificationServiceImpl\n  qQuestionSvc: QualificationQuestionServiceImpl\n  reviewSvc: \"QualificationReviewServiceImpl\\nrequired-approvals = 2\"\n  readinessSvc: QualificationReadinessServiceImpl\n  poolSvc: \"QualificationPoolServiceImpl\\nfreezeForGoLive()\"\n  attemptSvc: QualificationAttemptServiceImpl\n  starter: QualificationAttemptStarter\n  selector: AttemptQuestionSelector\n  grader: AttemptGrader\n  gate: \"QualificationAssignmentGate\" {style.fill: \"#ffe8e8\"}\n}\n\nrepo: \"Repository Layer\" {\n  questionRepo: \"QuestionRepository\\nQuestionOptionRepository\"\n  setRepo: \"QuestionSetRepository\\nQuestionSetItemRepository\"\n  defRepo: QualificationQuestionDefinitionRepository\n  reviewRepo: QualificationQuestionReviewRepository\n  configRepo: CampaignQualificationConfigRepository\n  poolRepo: \"CampaignQualificationPoolItemRepository\\nCampaignQualificationSetRuleRepository\"\n  attemptRepo: \"QualificationAttemptRepository\\n(lockByUuid = PESSIMISTIC_WRITE)\"\n  answerRepo: \"QualificationAttemptQuestionRepository\\nQualificationAttemptAnswerRepository\"\n}\n\ndb: \"MariaDB\" {shape: cylinder}\n\njob: \"QualificationAttemptExpiryJob\\ncron: 0 */5 * * * *\"\n\nassignment: \"TaskDistributionServiceImpl\\nRecommendedTaskAssignmentServiceImpl\" {\n  style.fill: \"#e8f4ff\"\n}\n\ncampaignSvc: \"CampaignServiceImpl\\napprove() / activate()\"\n\n# admin path\nadmin -> api.questionCtrl -> svc.questionSvc -> repo.questionRepo\nadmin -> api.setCtrl -> svc.setSvc -> repo.setRepo\nadmin -> api.qualCtrl -> svc.configSvc -> repo.configRepo\nadmin -> api.qQuestionCtrl -> svc.qQuestionSvc -> repo.defRepo\napi.qQuestionCtrl -> svc.reviewSvc -> repo.reviewRepo\napi.qualCtrl -> svc.readinessSvc\n\ncampaignSvc -> svc.poolSvc: \"freezeForGoLive\\n=> config.frozen = TRUE\"\nsvc.poolSvc -> repo.poolRepo\nsvc.poolSvc -> repo.configRepo\n\n# candidate path\ncandidate -> api.attemptStartCtrl -> svc.attemptSvc\ncandidate -> api.attemptCtrl -> svc.attemptSvc\nsvc.attemptSvc -> svc.starter: \"startAttempt\"\nsvc.starter -> svc.selector: \"bốc đề theo set rule\"\nsvc.attemptSvc -> svc.grader: \"submit() sau lockByUuid\"\nsvc.attemptSvc -> repo.attemptRepo\nsvc.attemptSvc -> repo.answerRepo\n\n# gate\nassignment -> svc.gate: \"blockedProjectIds / requirePassed\"\nsvc.gate -> repo.configRepo: \"config frozen mới nhất\"\nsvc.gate -> repo.attemptRepo: \"exists(configId, userId, PASSED)\"\n\njob -> repo.attemptRepo: \"quá expires_at\\nhoặc campaign rời ACTIVE => EXPIRED\"\n\nrepo -> db\n"},{"path":"services/qualification.md","type":"md","group":"services","title":"Domain: Qualification & Question Bank","content":"# Domain: Qualification & Question Bank\n\n> Ticket gốc: **RS2-10027** (được nhắc trong `application.yml` và javadoc).\n\n---\n\n## 1. Purpose\n\nMột campaign có thể yêu cầu annotator **thi đậu bài kiểm tra** trước khi được nhận task thật.\nDomain này gồm 2 nửa:\n\n| Nửa | Trả lời câu hỏi |\n|---|---|\n| **Question Bank** (`/questions`, `/question-sets`) | Ngân hàng câu hỏi & bộ đề dùng chung cho toàn hệ thống |\n| **Qualification** (`/campaigns/{id}/qualification`, `/qualification/**`) | Cấu hình bài test của campaign, chấm bài, giữ kết quả PASS/FAIL |\n\nNgoài ra, Question Set còn được project `SURVEY` dùng làm nội dung\n(`projects.question_set_id`).\n\n---\n\n## 2. Entry points\n\n### Question Bank\n\n| Method | Endpoint | Controller |\n|---|---|---|\n| POST/GET/PUT/DELETE | `/questions`, `/questions/{id}` | `QuestionController` |\n| PATCH | `/questions/{id}/publish` \\| `/deactivate` | `QuestionController` |\n| POST/GET/PUT/DELETE | `/question-sets`, `/question-sets/{id}` | `QuestionSetController` |\n| PATCH | `/question-sets/{id}/publish` \\| `/deactivate` | `QuestionSetController` |\n| POST/PUT/DELETE | `/question-sets/{id}/questions`, `/questions/order`, `/questions/{qid}/settings` | `QuestionSetController` |\n\n### Qualification — cấu hình (admin)\n\n| Method | Endpoint | Controller |\n|---|---|---|\n| GET/PUT | `/campaigns/{campaignId}/qualification` | `CampaignQualificationController` |\n| GET | `/campaigns/{campaignId}/qualification/readiness` | `CampaignQualificationController` |\n| POST | `/qualification/questions` | `QualificationQuestionController` — \"prepare\" định nghĩa câu hỏi |\n| PUT | `/qualification/questions/{id}/grading` | cấu hình cách chấm |\n| POST/GET | `/qualification/questions/{id}/reviews` | quy trình duyệt câu hỏi |\n\n### Qualification — thi (user)\n\n| Method | Endpoint | Controller |\n|---|---|---|\n| POST | `/campaigns/{campaignId}/qualification/attempts` | `CampaignQualificationAttemptController.startAttempt` |\n| GET | `/campaigns/{campaignId}/qualification/status` | trạng thái của tôi |\n| GET | `/qualification/attempts/{attemptId}` | `QualificationAttemptController` |\n| PUT | `/qualification/attempts/{attemptId}/answers/{attemptQuestionId}` | lưu từng câu (autosave) |\n| POST | `/qualification/attempts/{attemptId}/submit` | nộp bài + chấm |\n| GET | `/qualification/attempts/{attemptId}/result` | xem kết quả |\n\n---\n\n## 3. Business logic\n\n```\nCampaignQualificationController → CampaignQualificationServiceImpl   (config, freeze)\nQualificationQuestionController → QualificationQuestionServiceImpl   (định nghĩa + grading)\n                                → QualificationReviewServiceImpl     (duyệt 2 reviewer)\n                                → QualificationReadinessServiceImpl  (campaign đã sẵn sàng chưa)\nQualificationAttemptController  → QualificationAttemptServiceImpl\n                                     ├── QualificationAttemptStarter   (tạo attempt + bốc đề)\n                                     ├── AttemptQuestionSelector        (chọn câu theo set rule)\n                                     ├── AnswerShapeValidator / AttemptAnswerCodec\n                                     └── AttemptGrader                  (chấm)\nQualificationPoolServiceImpl    → freezeForGoLive(campaign)   ← gọi từ CampaignServiceImpl\nQualificationAssignmentGate     → dùng bởi TaskDistributionServiceImpl + RecommendedTaskAssignmentServiceImpl\n```\n\n---\n\n## 4. Persistence\n\n| Entity | Table | Ý nghĩa |\n|---|---|---|\n| `Question` / `QuestionOption` | `questions` / `question_options` | ngân hàng câu hỏi |\n| `QuestionSet` / `QuestionSetItem` | `question_sets` / `question_set_items` | bộ đề |\n| `QualificationQuestionDefinition` | `qualification_question_definitions` | câu hỏi đã gắn đáp án + cách chấm, có `verification_status` |\n| `QualificationQuestionReview` | `qualification_question_reviews` | mỗi lượt duyệt của reviewer |\n| `CampaignQualificationConfig` | `campaign_qualification_configs` | cấu hình test của campaign, có `version`, **`frozen`**, `required` |\n| `CampaignQualificationSetRule` | `campaign_qualification_set_rules` | rule bốc bao nhiêu câu từ set nào |\n| `CampaignQualificationPoolItem` | `campaign_qualification_pool_items` | pool đã freeze |\n| `QualificationAttempt` | `qualification_attempts` | 1 lượt thi |\n| `QualificationAttemptQuestion` | `qualification_attempt_questions` | snapshot đề của lượt thi đó |\n| `QualificationAttemptAnswer` | `qualification_attempt_answers` | câu trả lời |\n\n### Enum quan trọng\n\n- `QualificationVerificationStatus`: `DRAFT | PENDING_REVIEW | VERIFIED | REJECTED`\n- `QualificationAttemptStatus`: `IN_PROGRESS | PASSED | FAILED | EXPIRED | CANCELLED`\n- `GradingMode`: `EXACT_SINGLE | EXACT_SET | ACCEPTED_TEXT | AUTO_PASS_ON_VALID_INPUT`\n- `AnswerResultCode`: `CORRECT | INCORRECT | MISSING | INVALID_FORMAT | AUTO_PASS`\n- `QualificationMetricType`: `GOLD_ACCURACY | COHEN_KAPPA | ...`\n\n---\n\n## 5. Integration\n\nKhông gọi hệ thống ngoài. Domain thuần nội bộ Questlab.\n\n---\n\n## 6. Background processing\n\n| Job | Cron | Làm gì |\n|---|---|---|\n| `QualificationAttemptExpiryJob` | `qualification.attempt.expiry-cron` = `0 */5 * * * *` | Đóng attempt (a) quá `expires_at`, (b) campaign đã rời `ACTIVE` |\n\nJob này dùng `HashSet\u003cLong> seen` để **khử trùng**: một attempt có thể vừa quá hạn vừa mồ côi,\nxử lý 2 lần sẽ ghi row 2 lần và log 2 lần.\n\nJavadoc nói rõ vì sao job này bắt buộc phải có: *\"Only one attempt per candidate may be open at\na time, so an abandoned one blocks them from ever starting again (D7).\"* — attempt bỏ dở mà\nkhông hết hạn sẽ **khoá vĩnh viễn** quyền thi lại của user.\n\nĐồng thời, user quay lại trước khi job chạy **không phải chờ**: service tự đóng attempt quá hạn\nngay tại chỗ.\n\n**Evidence:** `job/QualificationAttemptExpiryJob.java:44-84`\n\n---\n\n## 7. Important flows\n\n### 7.1 Freeze — vì sao PASS có thể \"mất giá trị\"\n\n```\nAdmin sửa cấu hình test    →  tạo CampaignQualificationConfig version mới (frozen = false)\nAdmin approve/activate campaign →  QualificationPoolService.freezeForGoLive()\n                                     → chốt pool item, set frozen = TRUE\n```\n\n`QualificationAssignmentGate.blockedByCampaign` đọc **config `frozen` mới nhất**, không phải\nversion mới nhất:\n\n```java\nOptional\u003cCampaignQualificationConfig> frozen = configRepository\n    .findFirstByCampaignIdAndFrozenTrueAndIsDeletedFalseOrderByVersionDesc(campaignId);\nif (frozen.isEmpty() || !frozen.get().isRequired()) return false;   // cho qua\nboolean passed = attemptRepository.existsByQualificationConfigIdAndUserIdAndStatusAndIsDeletedFalse(\n        config.getId(), userId, PASSED);\nreturn !passed;\n```\n\n⇒ PASS gắn với **một `qualificationConfigId` cụ thể**. Admin freeze version mới ⇒ PASS cũ\nkhông còn khớp ⇒ user phải thi lại (§3.2.13).\n\n### 7.2 Gate — 3 nhánh cho qua\n\n`QualificationAssignmentGate` (dùng trong `requestTask`) cho qua khi:\n\n1. project không thuộc `ACTIVE` campaign nào;\n2. campaign chưa có config `frozen`;\n3. config `frozen` hiện hành có `required = false`.\n\nHai API dùng gate theo 2 kiểu khác nhau:\n\n| Nơi gọi | Method | Hành vi |\n|---|---|---|\n| `requestTask` (quét nhiều project) | `blockedProjectIds(userId, ids)` | **loại khỏi candidate**, không throw |\n| `directAssign`, recommendation-assign (đã chọn đúng 1 task) | `requirePassed(userId, projectId)` | **throw** `BadRequestException(QUALIFICATION_REQUIRED)` để user biết đi thi |\n\n`blockedProjectIds` tối ưu: cache kết quả theo `campaignId` bằng `computeIfAbsent`, nên số query\nlà **O(số campaign)** chứ không phải O(số project).\n\n**Evidence:** `service/qualification/QualificationAssignmentGate.java:56-141`\n\n### 7.3 Submit attempt — chống chấm 2 lần\n\n```java\n@Transactional\npublic QualificationAttemptResultResponse submit(UUID attemptId, UUID userId) {\n  QualificationAttempt attempt = attemptRepository.lockByUuid(attemptId)   // PESSIMISTIC_WRITE\n      ...\n```\n\nJavadoc của `lockByUuid`: *\"Submitting twice — a retried request after a timeout — must not\nscore twice (§22.2). The lock serialises the two calls so the second one sees the terminal state\nand returns the stored result.\"*\n\nĐây là **idempotency bằng pessimistic lock + terminal-state check** — mẫu đáng nhớ.\n\n**Evidence:** `repository/qualification/QualificationAttemptRepository.java:20-29`,\n`service/qualification/impl/QualificationAttemptServiceImpl.java:226-230`\n\n### 7.4 `startAttempt` cố ý KHÔNG `@Transactional`\n\nJavadoc: *\"Deliberately not `@Transactional`: the write runs in the starter's own [transaction]\"*\n— tách boundary để `QualificationAttemptStarter` tự quản lý.\n\n### 7.5 Duyệt câu hỏi — 2 reviewer\n\n`qualification.review.required-approvals: 2` — definition chỉ thành `VERIFIED` khi có **2\nreviewer KHÁC NHAU** APPROVE.\n\n⚠️ Comment trong `application.yml` cảnh báo:\n*\"`[SECURITY REVIEW REQUIRED]` chỉ có ý nghĩa thật khi ops tạo role reviewer riêng và gán ≥2\nngười — hiện mọi migration mới seed `sys_admin` (D1).\"*\n\n### 7.6 Readiness — campaign đủ điều kiện approve chưa\n\n`QualificationReadinessService` trả về danh sách `QualificationReadinessIssue`:\n`QUALIFICATION_NOT_CONFIGURED`, `NO_QUESTION_SET_LINKED`, `TOTAL_VERIFIED_POOL_TOO_SMALL`,\n`METRIC_NOT_SUPPORTED`, `QUALIFICATION_SETS_OVERLAP`, `INSUFFICIENT_VERIFIED_QUESTIONS`,\n`SET_NOT_USABLE`, `SOURCE_INTEGRITY_ERROR`.\n\n`qualification.min-verified-pool-size: 30` — chặn đề thi ít câu tới mức học thuộc được.\n\n---\n\n## 8. Risk\n\n- **Attempt bỏ dở khoá quyền thi lại** — đã có `QualificationAttemptExpiryJob` + auto-close\n  tại chỗ. Nếu job chết, user bị kẹt.\n- **Retry policy**: `qualification.retry.default-max-attempts: 3`,\n  `default-cooldown-minutes: 1440`. Lưu ý API: gửi `retryPolicy` với `maxAttempts = null` nghĩa\n  là **KHÔNG giới hạn**, khác với **không gửi** `retryPolicy` (dùng default). Đây là bẫy API\n  được ghi rõ trong `application.yml` §12.2.\n- **`attempt_ttl_minutes` = 120 là đề xuất, product chưa chốt** (`[VERIFY]` trong config).\n- Cấu hình theo thứ tự: cột trong `campaign_qualification_configs` (NULL = kế thừa) →\n  `application.yml`. Đổi ở yml là campaign chưa pin giá trị riêng nhận ngay, không cần migration.\n\n---\n\n## 9. Diagram\n\nXem `qualification.d2`.\n"},{"path":"services/recommendation.d2","type":"d2","group":"services","title":"Recommendation","content":"# Questlab — Task Recommendation + Redis\n# Render: https://play.d2lang.com/\n\ndirection: right\n\ntitle: |md\n  # Home Recommendation — nơi duy nhất dùng Redis\n| {near: top-center}\n\napp: \"Mobile App — màn hình Home\" {shape: person}\n\napi: \"TaskRecommendationController\\n/assignments/recommendations\" {\n  get: \"GET  /  (danh sách gợi ý)\"\n  assign: \"POST /{recommendationId}/assign\"\n}\n\nsvc: \"Business Layer\" {\n  recSvc: TaskRecommendationServiceImpl\n  candidateSvc: \"TaskRecommendationCandidateServiceImpl\\npool-size = 20\"\n  cacheSvc: \"TaskRecommendationCacheServiceImpl\\n(mọi op bọc DataAccessException)\" {\n    style.fill: \"#ffe0e0\"\n  }\n  assignSvc: \"RecommendedTaskAssignmentServiceImpl\\nrevalidate -> lock -> assign\"\n  eligibility: ProjectEligibilityServiceImpl\n  gate: QualificationAssignmentGate\n}\n\nredis: \"Redis — database 11 (CacheRedisService)\" {\n  shape: cylinder\n  style.fill: \"#ffe0e0\"\n  k1: \"questlab:recommendations:user:{userId}\\nString JSON, TTL 600s\"\n  k2: \"questlab:recommendations:id:{recommendationId}\\nString JSON, TTL 600s\"\n  k3: \"questlab:recommendations:watchlist\\nHASH userId -> 1 (dedup, no TTL)\"\n}\n\nrepo: \"Repository\" {\n  taskRepo: \"TaskRepository\"\n  q1: \"findRecommendableTaskIds\\nKHÔNG lock (read-only)\"\n  q2: \"lockRecommendedTaskForUser\\nFOR UPDATE (click time)\"\n  assignedRepo: AssignedTaskRepository\n}\n\ndb: \"MariaDB — tasks / assigned_tasks / projects\" {shape: cylinder}\n\njob: \"TaskRecommendationRefillJob\\ncron 0 */5 * * * *  batch-size 100\" {\n  style.fill: \"#eaffea\"\n}\n\nproducers: \"Ai đẩy vào watchlist\" {\n  p1: \"AnnotationServiceImpl.createAnnotation\"\n  p2: \"AssignmentExpiryJob\"\n  p3: \"RecommendedTaskAssignmentServiceImpl.assign\"\n  p4: \"TaskRecommendationServiceImpl (cache miss)\"\n}\n\n# read path\napp -> api.get -> svc.recSvc\nsvc.recSvc -> svc.cacheSvc: \"readUserCache\"\nsvc.cacheSvc -> redis.k1\nsvc.recSvc -> svc.candidateSvc: \"MISS -> build(userId, 20, ttl)\"\nsvc.candidateSvc -> svc.eligibility\nsvc.candidateSvc -> repo.q1\nsvc.recSvc -> svc.cacheSvc: \"writeUserCache (envelope + từng lookup)\"\nsvc.cacheSvc -> redis.k2\n\n# assign path\napp -> api.assign -> svc.assignSvc\nsvc.assignSvc -> svc.cacheSvc: \"1. readLookup\\n2. ownership\\n3. expiry\"\nsvc.cacheSvc -> redis.k2\nsvc.assignSvc -> svc.eligibility: \"4a. revalidate policy TẠI THỜI ĐIỂM CLICK\"\nsvc.assignSvc -> svc.gate: \"4b. qualification\"\nsvc.assignSvc -> repo.q2: \"4c. lock\"\nsvc.assignSvc -> repo.assignedRepo: \"4d. tạo AssignedTask PENDING\"\nsvc.assignSvc -> svc.cacheSvc: \"5. evictUserCache + enqueueWatchlist\"\n\n# refill\njob -> svc.cacheSvc: \"popWatchlistBatch(100)\"\nsvc.cacheSvc -> redis.k3\njob -> svc.candidateSvc: \"build lại cache cho từng user\"\n\nproducers.p1 -> redis.k3\nproducers.p2 -> redis.k3\nproducers.p3 -> redis.k3\nproducers.p4 -> redis.k3\n\nrepo.q1 -> db\nrepo.q2 -> db\nrepo.assignedRepo -> db\n\nnote: |md\n  ### Nguyên tắc\n  Cache **chỉ là gợi ý**, không phải quyền.\n  Mọi điều kiện được **revalidate tại thời điểm click**,\n  và `FOR UPDATE` đặt ở đó — không phải lúc build cache.\n\n  Redis down => `DataAccessException` => coi như cache miss => degrade sang SQL.\n  `POST /assignments/request` KHÔNG đụng Redis.\n| {near: bottom-center}\n"},{"path":"services/recommendation.md","type":"md","group":"services","title":"Domain: Task Recommendation (\"Dành cho bạn\") — và Redis","content":"# Domain: Task Recommendation (\"Dành cho bạn\") — và Redis\n\n> Requirement gốc: `docs/REQUIREMENT-HOME-RECOMMENDED-TASKS.md`.\n> **Đây là domain DUY NHẤT dùng Redis trong questlab-service.**\n\n---\n\n## 1. Purpose\n\nMàn hình Home của app hiển thị vài task gợi ý sẵn cho user, thay vì bắt bấm \"xin task\" rồi\nchờ. Chạy lại toàn bộ eligibility + policy + SQL chọn task ở **mỗi lần mở app** là quá đắt →\nkết quả được cache trong Redis, và một job nền refill trước.\n\n---\n\n## 2. Entry points\n\n| Method | Endpoint | Controller | Mục đích |\n|---|---|---|---|\n| GET | `/assignments/recommendations` | `TaskRecommendationController.getRecommendations` | Lấy danh sách gợi ý (đọc cache, miss thì build) |\n| POST | `/assignments/recommendations/{recommendationId}/assign` | `TaskRecommendationController.assignRecommendation` | Bấm nhận → revalidate + lock + tạo assignment |\n\n---\n\n## 3. Business logic\n\n```\nTaskRecommendationController\n    ├── TaskRecommendationServiceImpl          (đọc/ghi cache, build response)\n    │      ├── TaskRecommendationCacheServiceImpl   ← Redis\n    │      ├── TaskRecommendationCandidateServiceImpl\n    │      │       └── TaskRepository.findRecommendableTaskIds  (KHÔNG lock)\n    │      └── TaskRecommendationMapper\n    └── RecommendedTaskAssignmentServiceImpl   (nhận task)\n           └── TaskRepository.lockRecommendedTaskForUser  (CÓ FOR UPDATE)\n```\n\n---\n\n## 4. Redis — dùng cho việc gì\n\n`CacheServiceConfig` tạo bean `CacheRedisService` (từ thư viện `com.ttt.base:cache`) bọc\n`RedisTemplate\u003cObject,Object>`. **Không** dùng `@Cacheable`/`@CacheEvict` của Spring, **không**\ndùng Redisson, **không** dùng distributed lock.\n\n| Key | Kiểu | TTL | Nội dung |\n|---|---|---|---|\n| `questlab:recommendations:user:{userId}` | String (JSON) | `recommendations.cache.ttl-seconds` = 600s | `UserRecommendationCache` — envelope chứa `items[]` |\n| `questlab:recommendations:id:{recommendationId}` | String (JSON) | 600s | `RecommendationLookup` — để resolve khi user bấm nhận |\n| `questlab:recommendations:watchlist` | **Hash** (`userId` → `\"1\"`) | không TTL | Hàng đợi user cần refill |\n\n**Evidence:** `assignment/recommendation/RecommendationCacheKeys.java`\n\n### Vì sao watchlist là Hash mà không phải List/Set?\n\nJavadoc `TaskRecommendationCacheServiceImpl`:\n\n> *\"Stores the watchlist as a Redis Hash keyed by user UUID so each user appears at most once\n> between drains.\"*\n> *\"The ttt interface does not expose atomic SETNX or Redis SET operations\"* — thư viện\n> `CacheRedisService` chỉ có `setValue/getValue/remove/hSet/hKeys/hDel`, nên Hash là cách khử\n> trùng khả dụng.\n\n### Không có lock rebuild — có chủ ý\n\n> *\"Skips per-user / per-job rebuild locks — the worst case is a duplicate cache build, which is\n> benign (the last write wins and concurrent requests still get a valid response).\"*\n\n### Redis chết thì sao?\n\nMọi thao tác Redis đều bọc `try/catch (DataAccessException)` và log `REDIS_DOWN`:\n\n```java\nprivate String readStringSafe(String key) {\n  try { ... } catch (DataAccessException ex) {\n    log.warn(\"[readStringSafe] REDIS_DOWN key={}, msg={}\", key, ex.getMessage());\n    return null;                     // coi như cache miss\n  }\n}\n```\n\n⇒ **Redis down = degrade, không phải chết**. Recommendation rơi về build trực tiếp từ SQL.\n`POST /assignments/request` (luồng xin task chính) **không đụng Redis** nên không bị ảnh hưởng.\n\n### Schema versioning\n\n`UserRecommendationCache.CURRENT_SCHEMA_VERSION`. Đọc ra mà version khác → **evict + coi như\nmiss**. Nhờ vậy deploy đổi cấu trúc cache không cần flush Redis thủ công.\n\n---\n\n## 5. Background processing\n\n| Job | Cron | Làm gì |\n|---|---|---|\n| `TaskRecommendationRefillJob` | `recommendations.refill.cron` = `0 */5 * * * *` | `popWatchlistBatch(batch-size=100)` → với mỗi user: `candidateService.build(...)` → `writeUserCache(...)` |\n\nXử lý lỗi trong job:\n\n```java\ncatch (AuthProfileUnavailableException ex) {\n    cacheService.enqueueWatchlist(userId);       // re-enqueue để lần sau thử lại\n    // hash dedup tạo ra backoff tự nhiên\n}\ncatch (Exception ex) {\n    // đếm otherFailures, KHÔNG re-enqueue\n}\n```\n\nPool rỗng **không** re-enqueue: *\"Empty pool is a legitimate outcome — don't keep retrying\nimmediately.\"*\n\n### Ai đẩy user vào watchlist?\n\n| Nơi | Khi nào |\n|---|---|\n| `AnnotationServiceImpl.createAnnotation` | user vừa submit → slot đã dùng, cache cũ sai |\n| `AssignmentExpiryJob` | assignment hết hạn → có slot mới |\n| `RecommendedTaskAssignmentServiceImpl.assign` | nhận task thành công |\n| `TaskRecommendationServiceImpl` | cache miss / stale |\n\n---\n\n## 6. Important flows\n\n### 6.1 GET recommendations\n\n```\nGET /assignments/recommendations\n    ↓ TaskRecommendationServiceImpl\n    1. cacheService.readUserCache(userId)\n         HIT  → validate lại tính \"còn dùng được\" của từng item, trả về (max recommendations.response.max-items = 5)\n         MISS → enqueueWatchlist(userId)\n                candidateService.build(userId, pool-size=20, ttl=600)\n                writeUserCache(envelope)   ← ghi cả envelope lẫn từng lookup key\n```\n\n`candidate.pool-size: 20` nhưng `response.max-items: 5` — build dư 20 để khi vài item bị \"ôi\"\nvẫn còn đủ 5 cái trả về mà không phải query lại.\n\nQuery dùng: `TaskRepository.findRecommendableTaskIds` — **cùng predicate với\n`findNextAssignableTaskId`** (status, alive, overlap slot, dedup, `max_overlap_ratio`) nhưng\ntrả nhiều dòng và **KHÔNG có `FOR UPDATE`**, vì đây là đường read-only.\n\n### 6.2 POST assign recommendation — 5 bước\n\n```\n1. cacheService.readLookup(recommendationId)\n      empty → RECOMMENDATION_NOT_FOUND (kết quả \"stale\" bình thường, không phải lỗi)\n2. ownership check: lookup.userId == userId ?\n      không khớp → trả NOT_FOUND (KHÔNG trả FORBIDDEN — tránh lộ sự tồn tại của id user khác)\n3. expiry check: lookup.expiresAt \u003c now → deleteLookup + RECOMMENDATION_EXPIRED\n4. revalidateAndAssign(userId, lookup):\n      - quota check\n      - lấy profile + build context   (AuthProfileUnavailableException → 503 mềm)\n      - findEligibleProjects tại thời điểm CLICK (policy có thể đã đổi từ lúc build cache)\n      - qualification gate\n      - taskRepository.lockRecommendedTaskForUser(userId, projectId, taskId)  ← FOR UPDATE\n            empty → RECOMMENDATION_TASK_NOT_ASSIGNABLE (ai đó đã lấy mất)\n      - tạo AssignedTask PENDING + updateTaskStatus\n5. thành công → evictUserCache + enqueueWatchlist\n   stale có mã biết trước → deleteLookup (retry cùng id sẽ nhanh)\n```\n\n**Điểm thiết kế quan trọng:** cache **chỉ là gợi ý**, không phải quyền. Mọi điều kiện được\n**revalidate tại thời điểm click**, và lock đặt ở đó chứ không ở lúc build cache.\n\n**Evidence:** `service/impl/RecommendedTaskAssignmentServiceImpl.java:68-160`,\n`repository/TaskRepository.java:256-332`\n\n---\n\n## 7. Risk\n\n| Rủi ro | Xử lý |\n|---|---|\n| Cache stale → user bấm vào task đã bị người khác lấy | `lockRecommendedTaskForUser` trả empty → `RECOMMENDATION_TASK_NOT_ASSIGNABLE`, FE hiển thị \"task không còn\" |\n| User A dùng recommendationId của user B | Ownership check, trả `NOT_FOUND` để không lộ thông tin |\n| Redis down | Mọi op bọc `DataAccessException` → degrade sang SQL |\n| Cache schema đổi khi deploy | `schemaVersion` mismatch → evict |\n| Watchlist phình to | Hash dedup + `popWatchlistBatch` xoá field khi lấy ra |\n| Duplicate cache build | Chấp nhận (benign, last-write-wins) |\n| **`@Transactional protected revalidateAndAssign` bị self-invocation** | Annotation **không có hiệu lực** (Spring proxy không chặn self-call). An toàn nhờ `FOR UPDATE` trong query, nhưng là điểm cần biết |\n\n---\n\n## 8. Diagram\n\nXem `recommendation.d2`.\n"},{"path":"services/task-assignment.d2","type":"d2","group":"services","title":"Task Assignment","content":"# Questlab — Task Assignment domain\n# Render: https://play.d2lang.com/\n\ndirection: right\n\ntitle: |md\n  # Task Assignment — POST /assignments/request\n| {near: top-center}\n\nclient: \"Mobile App / Portal\" {shape: person}\n\napi: \"API Layer\" {\n  assignmentController: AssignmentController\n  taskController: TaskController\n  recController: TaskRecommendationController\n}\n\nbusiness: \"Business Layer\" {\n  taskDistribution: TaskDistributionServiceImpl\n\n  eligibility: ProjectEligibilityServiceImpl\n  policyService: ProjectAssignmentPolicyServiceImpl\n  evaluator: AssignmentPolicyEvaluatorImpl\n  ctxBuilder: AssignmentProfileContextBuilder\n  gate: QualificationAssignmentGate\n\n  taskService: TaskServiceImpl\n  recAssign: RecommendedTaskAssignmentServiceImpl\n}\n\nrepo: \"Repository Layer\" {\n  taskRepo: TaskRepository\n  assignedRepo: AssignedTaskRepository\n  projectRepo: ProjectRepository\n  policyRepo: ProjectAssignmentPolicyRepository\n  campaignProjectRepo: CampaignProjectRepository\n}\n\ndb: \"MariaDB — questlab_data\" {\n  shape: cylinder\n\n  tasks: tasks\n  assigned: assigned_tasks\n  projects: projects\n  policies: project_assignment_policies\n}\n\nredis: \"Redis (database 11)\" {shape: cylinder}\n\nauthService: \"auth-service\" {shape: hexagon}\n\njob: \"AssignmentExpiryJob\\ncron: assignment.expiry.cron\"\n\n# ── entry points ──\nclient -> api.assignmentController: \"POST /assignments/request\"\nclient -> api.taskController: \"GET /tasks/my-assigned\"\nclient -> api.recController: \"POST /recommendations/{id}/assign\"\n\napi.assignmentController -> business.taskDistribution: \"requestTask(userId)\"\napi.taskController -> business.taskService\napi.recController -> business.recAssign\n\n# ── requestTask, 8 steps, one @Transactional ──\nbusiness.taskDistribution -> repo.assignedRepo: \"1. countActiveByUserId (quota)\"\nbusiness.taskDistribution -> authService: \"2. AuthProfileClient.getUserProfile\"\nbusiness.taskDistribution -> business.ctxBuilder: \"3. build profile context\"\nbusiness.taskDistribution -> business.eligibility: \"4. findEligibleProjects\"\nbusiness.taskDistribution -> business.gate: \"5. blockedProjectIds\"\nbusiness.taskDistribution -> repo.taskRepo: \"6. findNextAssignableTaskId\\nFOR UPDATE\"\nbusiness.taskDistribution -> repo.assignedRepo: \"7. save AssignedTask PENDING\"\nbusiness.taskDistribution -> repo.taskRepo: \"8. updateTaskStatus IN_PROGRESS\"\n\nbusiness.eligibility -> repo.projectRepo: \"findActiveAssignableProjects\"\nbusiness.eligibility -> business.policyService: \"getEnabledCompiledPolicy\"\nbusiness.policyService -> repo.policyRepo\nbusiness.eligibility -> business.evaluator: \"evaluate(policy, context)\"\nbusiness.gate -> repo.campaignProjectRepo: \"findActiveCampaignLinks\"\n\nbusiness.recAssign -> repo.taskRepo: \"lockRecommendedTaskForUser\\nFOR UPDATE\"\nbusiness.recAssign -> redis: \"readLookup / evictUserCache\"\n\n# ── persistence ──\nrepo.taskRepo -> db.tasks\nrepo.assignedRepo -> db.assigned\nrepo.projectRepo -> db.projects\nrepo.policyRepo -> db.policies\nrepo.campaignProjectRepo -> db\n\n# ── background ──\njob -> repo.assignedRepo: \"markExpiredBefore\"\njob -> repo.taskRepo: \"revertToAvailableWhereNoPending\"\njob -> redis: \"enqueueWatchlist\"\n"},{"path":"services/task-assignment.md","type":"md","group":"services","title":"Domain: Task & Assignment (phân phối task)","content":"# Domain: Task & Assignment (phân phối task)\n\n> Đây là **domain lõi** của Questlab. Nếu chỉ có thời gian đọc 1 domain, đọc domain này.\n\n---\n\n## 1. Purpose — domain này giải quyết nghiệp vụ gì?\n\nQuestlab là nền tảng **crowdsourcing gán nhãn dữ liệu (data labeling)**. Người dùng (annotator)\nmở app, bấm \"nhận việc\", hệ thống phải chọn ra **một task phù hợp** và **giao độc quyền có\nthời hạn** cho người đó.\n\nBài toán khó nằm ở 5 ràng buộc phải đồng thời đúng:\n\n1. **Overlap** — mỗi task cần được N người **khác nhau** gán nhãn độc lập (`tasks.overlap`)\n   để đo đồng thuận. Không được cấp quá N suất.\n2. **Không lặp người** — cùng một user không được nhận lại task mình đã làm.\n3. **Eligibility** — user phải khớp *Project Assignment Policy* (điều kiện dựa trên profile).\n4. **Qualification gate** — nếu project thuộc campaign yêu cầu bài test, user phải PASS trước.\n5. **Race condition** — hai user bấm cùng lúc không được nhận trùng task.\n\n---\n\n## 2. Entry points\n\n| Method | Endpoint | Controller | Mục đích |\n|---|---|---|---|\n| POST | `/assignments/request` | `AssignmentController.requestTask` | User tự xin task mới (luồng chính) |\n| GET | `/assignments` | `AssignmentController.getMyAssignments` | Danh sách assignment của tôi |\n| POST | `/assignments/admin/direct` | `AssignmentController.directAssign` | Admin/demo gán tay cho 1 user trong 1 project |\n| GET | `/tasks/my-assigned` | `TaskController.getMyAssignedTasksInProject` | Assignment của tôi trong 1 project, có filter/sort/`statusCounts` |\n| GET | `/tasks/{taskId}` | `TaskController.getTaskById` | Chi tiết task (data lấy từ Label Studio, media URL được ký lại) |\n| GET | `/tasks/assignable` | `TaskController.getAssignableTasks` | Task còn suất overlap |\n| POST | `/assignments/recommendations/{id}/assign` | `TaskRecommendationController` | Nhận task từ gợi ý \"Dành cho bạn\" |\n| POST | `/integration/tasks/request` | `IntegrationController` | Partner SDK xin task (pool chung, xem `partner-integration.md`) |\n\n**Evidence:**\n- `questlab-service/src/main/java/com/ttt/questlab/controller/AssignmentController.java`\n- `questlab-service/src/main/java/com/ttt/questlab/controller/TaskController.java`\n\n---\n\n## 3. Business logic\n\n```\nAssignmentController\n    ↓\nTaskDistributionService (interface)\n    ↓\nTaskDistributionServiceImpl\n    ├── AssignedTaskRepository      (quota, tạo assignment)\n    ├── AuthProfileClient           → auth-service (profile của user)\n    ├── AssignmentProfileContextBuilder  (flatten profile → context)\n    ├── ProjectEligibilityService   → ProjectAssignmentPolicyService + AssignmentPolicyEvaluator\n    ├── QualificationAssignmentGate → CampaignProjectRepository + CampaignQualificationConfigRepository\n    ├── TaskRepository              (query chọn task + FOR UPDATE)\n    └── ProjectRepository\n```\n\n**Evidence:** `service/impl/TaskDistributionServiceImpl.java:50-139`\n\n### Luồng `requestTask(userId)` — đọc kỹ 8 bước\n\n`TaskDistributionServiceImpl.requestTask` được đánh dấu `@Transactional` (dòng 70). Toàn bộ 8\nbước dưới đây chạy trong **một transaction duy nhất**:\n\n| # | Bước | Code |\n|---|---|---|\n| 1 | **Quota** — đếm assignment `PENDING` của user, ≥ `assignment.max-concurrent-tasks` (=10) thì từ chối | `checkUserQuota()` → `assignedTaskRepository.countActiveByUserId` |\n| 2 | **Lấy profile** từ auth-service. Lỗi → `AuthProfileUnavailableException` (503, retryable), **không** gán bừa | `authProfileClient.getUserProfile(userId)` |\n| 3 | **Build context** — flatten profile thành map field phẳng để evaluator dùng | `profileContextBuilder.build(profile)` |\n| 4 | **Lọc project đủ điều kiện** — chạy policy của từng project ACTIVE + MATCHED | `projectEligibilityService.findEligibleProjects` |\n| 5 | **Qualification gate** — loại project của campaign yêu cầu test mà user chưa PASS. Cố ý **loại khỏi candidate chứ không throw**, vì một request quét nhiều project | `qualificationAssignmentGate.blockedProjectIds` (dòng 96-110) |\n| 6 | **Chọn task + KHOÁ ROW** | `taskRepository.findNextAssignableTaskId(...)` — native SQL có `FOR UPDATE` |\n| 7 | **Tạo assignment** `PENDING`, `expiredAt = now + assignment.expiry.minutes` (=4320 phút = 3 ngày), kèm **snapshot** profile/policy | `createAssignment()` |\n| 8 | **Đổi task status** `AVAILABLE → IN_PROGRESS` (chỉ khi đang AVAILABLE) | `updateTaskStatusIfNeeded()` |\n\nKhi không tìm được gì, method **trả về `RequestTaskResult` có `message` mô tả lý do**, HTTP vẫn\n200 và `data = null` — chứ không ném exception. Các message thực tế trong source:\n`\"No eligible projects for current user profile.\"`,\n`\"You must pass the campaign qualification test before receiving its tasks.\"`,\n`\"No tasks available for eligible projects.\"`,\n`\"You have reached the maximum concurrent tasks (N).\"`\n\n---\n\n## 4. Persistence\n\n| Entity | Table | Repository | Ý nghĩa nghiệp vụ |\n|---|---|---|---|\n| `Task` | `tasks` | `TaskRepository` | 1 đơn vị dữ liệu cần gán nhãn; mirror của LS task (`ls_task_id` unique) |\n| `AssignedTask` | `assigned_tasks` | `AssignedTaskRepository` | 1 lượt giao task cho 1 user, có hạn |\n| `TaskAnnotation` | `task_annotations` | `TaskAnnotationRepository` | Kết quả gán nhãn user submit |\n| `Project` | `projects` | `ProjectRepository` | Mirror của LS project |\n| `ProjectAssignmentPolicy` | `project_assignment_policies` | `ProjectAssignmentPolicyRepository` | Điều kiện eligibility, có version + hash |\n\n### Cột quan trọng\n\n`tasks`: `overlap` (số người cần), `annotation_count` (đã có bao nhiêu annotation),\n`task_status` ∈ `UNAVAILABLE | AVAILABLE | IN_PROGRESS | COMPLETED`, `ls_task_id`, `data_json`.\n\n`assigned_tasks`: `status` ∈ `PENDING | ANNOTATED | EXPIRED | CANCELLED`,\n`assigned_at`, `expired_at`, **`version` (`@Version` — optimistic locking)**, và 4 cột snapshot:\n`profile_context_json`, `matched_policy_version`, `matched_policy_hash`, `match_reason_json`.\n\n> **Vì sao có snapshot?** Để sau này audit được \"tại thời điểm gán, user này khớp policy version\n> mấy, vì điều kiện nào\". Policy có thể đổi sau đó. Serialize lỗi thì ghi `null` chứ **không** làm\n> hỏng assignment (`writeJsonOrNull`, dòng 384-392).\n\n**Evidence:** `entities/Task.java`, `entities/AssignedTask.java`, `entities/ProjectAssignmentPolicy.java`\n\n---\n\n## 5. Integration\n\n| Hệ thống ngoài | Gọi ở đâu | Mục đích |\n|---|---|---|\n| **auth-service** | `AuthProfileClient.getUserProfile` (trong `requestTask`) | Lấy profile để đánh giá eligibility |\n| **Label Studio** | `LabelStudioClient` (ở `TaskServiceImpl.getTaskById`, `AnnotationServiceImpl`) | Lấy nội dung task, tạo/sửa annotation |\n\nAssignment **không** được đẩy sang Label Studio. Label Studio không biết Questlab đang giao task\ncho ai — xem `label-studio-sync.md` §Source of Truth.\n\n---\n\n## 6. Background processing\n\n| Job | Cron (default) | Làm gì |\n|---|---|---|\n| `AssignmentExpiryJob` | `assignment.expiry.cron` = `0 0/10 * * * *` (10 phút/lần) | `PENDING` quá `expired_at` → `EXPIRED`; task không còn `PENDING` và chưa đủ `ANNOTATED` → trả về `AVAILABLE`; đẩy user vào watchlist Redis |\n\n**Evidence:** `job/AssignmentExpiryJob.java:37-58`\n\nChuỗi thao tác trong job (thứ tự quan trọng):\n\n```\nfindDistinctUserIdsPendingExpiredBefore(now)   ← đọc TRƯỚC khi update, vì sau update sẽ không còn PENDING\n    ↓\nmarkExpiredBefore(now)                          ← bulk UPDATE ... SET status='EXPIRED'\n    ↓\nrevertToAvailableWhereNoPending(now)            ← bulk UPDATE tasks SET task_status='AVAILABLE'\n    ↓\nrecommendationCacheService.enqueueWatchlist(userId)  ← Redis hash\n```\n\n---\n\n## 7. Important flows\n\n### 7.1 Query chọn task — `TaskRepository.findNextAssignableTaskId`\n\nNative SQL, đây là trái tim của domain:\n\n```sql\nSELECT t.id FROM tasks t\nWHERE t.ls_deleted = false\n  AND t.is_deleted = false\n  AND t.task_status IN ('AVAILABLE', 'IN_PROGRESS')\n  AND t.project_id IN (:eligibleProjectIds)\n  -- (2) còn suất overlap\n  AND (SELECT COUNT(*) FROM assigned_tasks a\n       WHERE a.task_id = t.id\n         AND a.status IN ('PENDING','ANNOTATED')\n         AND a.is_deleted = false) \u003c t.overlap\n  -- (3) user chưa nhận task này\n  AND NOT EXISTS (SELECT 1 FROM assigned_tasks a\n                  WHERE a.task_id = t.id AND a.user_id = :userId\n                    AND a.status IN ('PENDING','ANNOTATED') AND a.is_deleted = false)\n  -- (4) guard max_overlap_ratio: hạn chế 2 user cùng đụng quá nhiều task chung\n  AND NOT EXISTS ( ...correlated subquery 3 tầng... )\nORDER BY\n  CASE WHEN t.task_status = 'IN_PROGRESS' THEN 0 ELSE 1 END ASC,  -- lấp đầy slot dở trước\n  t.id ASC                                                        -- FIFO\nLIMIT 1\nFOR UPDATE\n```\n\n**Giải thích từng phần:**\n\n- **`task_status IN ('AVAILABLE','IN_PROGRESS')`** — task đang có người làm dở vẫn cấp tiếp\n  được, vì `overlap` cho phép nhiều người. Chỉ `COMPLETED`/`UNAVAILABLE` mới loại.\n- **`ORDER BY IN_PROGRESS trước`** — chủ ý nghiệp vụ: ưu tiên **lấp đầy** task đã có 1-2 người\n  làm để nó sớm đủ overlap và `COMPLETED`, thay vì rải mỏng ra nhiều task mới.\n- **`max_overlap_ratio`** — chặn hiện tượng hai annotator luôn được ghép cùng nhau (làm số liệu\n  đồng thuận mất tính độc lập). Ngưỡng = `FLOOR(tổng_task_project * max_overlap_ratio)`,\n  `= 0` nghĩa là cấm hoàn toàn trùng cặp.\n- **`FOR UPDATE`** — xem §8.\n\n**Performance concern (đã ghi ngay trong javadoc của repository):** điều kiện (4) là\ncorrelated subquery 3 tầng chạy trên mỗi row `tasks`. Javadoc đề nghị index\n`assigned_tasks(project_id, user_id, status)` khi dataset lớn.\n\n**Evidence:** `repository/TaskRepository.java:102-180`\n\n### 7.2 Submit annotation\n\n```\nPOST /annotations?assignedTaskId=...\n    ↓ AnnotationController.createNewAnnotation\n    ↓ AnnotationServiceImpl.createAnnotation  @Transactional\n    1. assignedTaskRepository.findByUuidAndStatus(id, PENDING)  → 404 nếu không có\n    2. check expiredAt \u003c now                                    → BadRequestException\n    3. check assignedTask.userId == userId                      → UnAuthorizedException\n    4. taskRepository.findById → check status != UNAVAILABLE\n    5. validationOrchestrator.validate(request, projectId)      ← validate theo label_config của project\n    6. labelStudioClient.createAnnotation(payload, lsTaskId)    ← GỌI RA NGOÀI, trong transaction\n    7. saveAnnotationAndUpdateStatus(...)\n         - INSERT task_annotations\n         - assigned_tasks.status = ANNOTATED\n         - tasks.annotation_count += 1\n         - nếu annotation_count+1 >= overlap → tasks.task_status = COMPLETED\n    8. recommendationCacheService.enqueueWatchlist(userId)      ← Redis\n```\n\n**Evidence:** `service/impl/AnnotationServiceImpl.java:49-131`\n\n---\n\n## 8. Risk — Transaction, concurrency, locking\n\n### 8.1 Race \"hai user cùng xin task\" — được xử lý thế nào?\n\nĐây là câu hỏi phỏng vấn số 1 của project này.\n\n```\nUser A                              User B\n  |                                   |\n  | BEGIN TX                          | BEGIN TX\n  | SELECT ... FOR UPDATE  ──────►    |\n  | (khoá row task #100)              | SELECT ... FOR UPDATE\n  |                                   | ⏸ BLOCKED (chờ row #100)\n  | INSERT assigned_tasks             |\n  | UPDATE tasks SET IN_PROGRESS      |\n  | COMMIT ──────────────────────►    |\n  |                                   | ▶ unblock, InnoDB dùng CURRENT READ\n  |                                   |   → đọc lại assigned_tasks với data mới\n  |                                   |   → điều kiện overlap/dedup được đánh giá lại\n  |                                   |   → nếu hết suất, task #100 bị loại, chọn task khác\n```\n\nCơ chế: **pessimistic row lock qua `SELECT ... FOR UPDATE`** trên bảng `tasks`, kết hợp việc\nInnoDB thực hiện *current read* (đọc bản mới nhất, không phải snapshot MVCC) khi transaction\nthứ hai được đánh thức. Chính javadoc của repository giải thích điều này:\n\n> *\"FOR UPDATE: lock row tasks được chọn. InnoDB dùng current read khi T2 unblock sau T1 commit,\n> nên assigned_tasks được re-read với data mới nhất → serialization đúng.\"*\n> — `TaskRepository.java:109-110`\n\n**Điểm cần lưu ý khi review:** lock đặt trên row `tasks`, còn điều kiện overlap đếm trên\n`assigned_tasks`. Việc này an toàn vì mọi đường cấp task đều phải qua row `tasks` đó trước\n(`findNextAssignableTaskId`, `lockRecommendedTaskForUser`,\n`findNextAvailableTaskIdOutsideGatedCampaigns` — cả ba đều `FOR UPDATE` trên `tasks`).\n\n### 8.2 `@Version` trên `AssignedTask`\n\n`AssignedTask.version` có `@Version` → optimistic locking. Nó bảo vệ trường hợp hai luồng cùng\n`save()` một assignment (ví dụ submit annotation đồng thời với expiry job) — luồng thua nhận\n`OptimisticLockingFailureException`.\n\n### 8.3 Gọi HTTP ra ngoài **bên trong** transaction\n\n`AnnotationServiceImpl.createAnnotation` là `@Transactional` nhưng gọi\n`labelStudioClient.createAnnotation` (HTTP, response timeout **120 giây** theo\n`RestTemplateConfig.RESPONSE_TIMEOUT_MS`) ở giữa transaction.\n\nHệ quả cần biết khi debug: DB connection bị giữ suốt thời gian chờ Label Studio. Khi LS chậm,\npool connection có thể cạn. Đây là đặc điểm hiện có của source, **không phải** khuyến nghị.\n\nTương tự, `requestTask` gọi `authProfileClient.getUserProfile` bên trong `@Transactional`.\n\n### 8.4 Idempotency\n\n- `POST /assignments/request` **không idempotent** — gọi 2 lần thì nhận 2 task khác nhau\n  (bị chặn bởi quota `max-concurrent-tasks`).\n- `POST /annotations` **không idempotent** — nhưng bước 1 yêu cầu assignment đang `PENDING`;\n  sau lần submit đầu status đổi thành `ANNOTATED` nên lần 2 sẽ 404\n  `\"No active assignment found for this task.\"` → **de-facto idempotent**.\n- Ngược lại, module Compensation **có** idempotency key thật (xem `compensation-payout.md`).\n\n### 8.5 `@Async` + `@Transactional` không đi cùng nhau\n\n`SyncServiceImpl` các handler webhook là `@Async(\"lsSyncExecutor\")` nhưng **không** có\n`@Transactional`. Mỗi lệnh repository tự chạy transaction riêng (`@Modifying @Transactional`\nđặt ở tầng repository). Nghĩa là một webhook xử lý nửa chừng lỗi sẽ để lại trạng thái *một\nphần* — nhưng vì các lệnh đều là `INSERT IGNORE` / `UPDATE ... WHERE` idempotent nên lần\nreconcile sau sẽ chữa lại.\n\n### 8.6 `revalidateAndAssign` — bẫy `protected` + self-invocation\n\n`RecommendedTaskAssignmentServiceImpl.revalidateAndAssign` khai báo\n`@Transactional protected` và được gọi từ `assign()` **trong cùng class**. Spring AOP proxy\nkhông chặn được self-invocation → annotation `@Transactional` này **không có hiệu lực**.\nViệc chọn task vẫn an toàn vì `lockRecommendedTaskForUser` có `FOR UPDATE` (query tự mở\ntransaction riêng), nhưng đây là điểm cầ
